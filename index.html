/* ============ Shift dialog ============ */
let dlgShift = null;
function openShift(shift, spId, preset) {
  const {salesPoints: sps, employees: emps} = cfg();
  const day = getDay(curDate);
  dlgShift = shift;
  const f = $('#dlgForm');
  const s = shift || {emp: '', sp: spId || (sps[0] && sps[0].id), start: 22, end: 30};
  if (preset) { const e = empById(preset.emp), pos = e && cfg().positions.find(p => e.allowed.includes(p.key) && empMask(e, p.sp)[preset.start]);
    Object.assign(s, {emp: preset.emp, start: preset.start, end: Math.min(SLOTS, preset.start + 8)}, pos ? {sp: pos.sp} : {}); }
  const working = new Set(day.working);
  const sorted = [...emps].sort((a, b) => (working.has(b.id) - working.has(a.id)) || a.name.localeCompare(b.name));
  f.emp.innerHTML = sorted.map(e => `<option value="${e.id}" ${e.id === s.emp ? 'selected' : ''}>${esc(e.name)}${working.has(e.id) ? '' : ' (not ticked in)'}</option>`).join('');
  f.sp.innerHTML = sps.map(x => `<option value="${x.id}" ${x.id === s.sp ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  let so = '', eo = '';
  for (let i = 0; i < SLOTS; i++) so += `<option value="${i}" ${i === s.start ? 'selected' : ''}>${slotTime(i)}</option>`;
  for (let i = 1; i <= SLOTS; i++) eo += `<option value="${i}" ${i === s.end ? 'selected' : ''}>${slotTime(i)}</option>`;
  f.start.innerHTML = so; f.end.innerHTML = eo;
  $('#dlgTitle').textContent = shift ? 'Edit shift' : 'Add shift';
  $('#dlgDel').hidden = !shift;
  $('#dlg').showModal();
}
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, day = getDay(curDate);
  const start = +f.start.value, end = +f.end.value;
  if (end <= start) { alert('The shift must end after it starts.'); return; }
  if (!f.emp.value) { alert('Pick an employee.'); return; }
  const data = {emp: f.emp.value, sp: f.sp.value, start, end};
  if (dlgShift) { if (dlgShift.emp !== data.emp) delete dlgShift.sub; Object.assign(dlgShift, data); } else day.shifts.push({id: uid(), ...data});
  $('#dlg').close(); placeBreaks(curDate, day); saveDay(curDate); render();
});
$('#dlgDel').onclick = () => { const day = getDay(curDate); day.shifts = day.shifts.filter(s => s !== dlgShift); $('#dlg').close(); placeBreaks(curDate, day); saveDay(curDate); render(); };
$('#dlgCancel').onclick = () => $('#dlg').close();

/* ============ Events ============ */
function setDate(d) { curDate = d; subscribeDay(); render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const day = getDay(curDate), C = cfg();
  switch (act) {
    case 'view': view = b.dataset.v; render(); return;
    case 'prev-day': setDate(addDays(curDate, -1)); return;
    case 'next-day': setDate(addDays(curDate, 1)); return;
    case 'today': setDate(todayStr()); return;
    case 'sign':
      if (!day.signing.includes(id)) { day.signing = [...day.signing, id]; day.signDir[id] = 'off'; }
      else if (day.signDir[id] !== 'on') day.signDir[id] = 'on';
      else { day.signing = day.signing.filter(x => x !== id); delete day.signDir[id]; }
      break;
    case 'toggle': day.working = day.working.includes(id) ? day.working.filter(x => x !== id) : [...day.working, id]; break;
    case 'all': day.working = C.employees.map(x => x.id); break;
    case 'none': day.working = []; break;
    case 'copyprev': { const p = state.days[addDays(curDate, -7)]; if (!p || !p.working.length) { alert('Nobody was ticked in on the same weekday last week.'); return; } day.working = [...p.working]; break; }
    case 'hours-reset': delete day.hours[id]; break;
    case 'port-reset': delete day.port; break;
    case 'pax-add': { const sp = spById(id), last = [...sp.paxRules].sort((a, b) => b.from - a.from)[0] || {from: 0, morning: 1, day: 1, night: 1};
      sp.paxRules.push({...last, from: last.from + 500}); saveConfig(); render(); return; }
    case 'pax-del': { const sp = spById(id); if (sp.paxRules.length <= 1) { alert('Keep at least one row.'); return; } sp.paxRules.splice(+b.dataset.i, 1); saveConfig(); render(); return; }
    case 'per-add': {
      const t = hoursTarget(b), last = t.h.periods[t.h.periods.length - 1];
      t.h.periods.push(last ? {open: last.close === '05:00' ? '18:00' : last.close, close: LATE} : {open: '12:00', close: '22:00'});
      t.commit(); return;
    }
    case 'per-del': { const t = hoursTarget(b); t.h.periods.splice(+b.dataset.i, 1); t.commit(); return; }
    case 'load-norrona':
      if (!confirm('Replace the standard weekly hours of all five sales points with the Norröna shoulder-season hours?')) return;
      applyNorrona(C); saveConfig(); render(); return;
    case 'gen':
      if (!day.working.length) { alert("Tick who's in today first."); return; }
      if (day.shifts.length && !confirm('Replace the current schedule for this day?')) return;
      try { day.shifts = generate(curDate, day); placeBreaks(curDate, day);
        for (let i = 0; i < 3 && fillWithBackups(curDate, day, day.shifts, computeCover(day)); i++) placeBreaks(curDate, day); }
      catch (err) { console.error(err); alert('Sorry, the schedule could not be generated: ' + err.message + '\n\nPlease download a backup (Sync & backup) and send it to get this fixed.'); return; }
      break;
    case 'dview': ui.dview = b.dataset.v; try { localStorage.setItem('staffsched.dview', ui.dview); } catch (e) {} render(); return;
    case 'add-shift': openShift(null, b.dataset.sp); return;
    case 'cell': {
      const s = day.shifts.find(x => x.emp === b.dataset.emp && +b.dataset.k >= x.start && +b.dataset.k < x.end);
      if (s) openShift(s); else openShift(null, null, {emp: b.dataset.emp, start: +b.dataset.k});
      return;
    }
    case 'edit-shift': { const s = day.shifts.find(x => x.id === id); if (s) openShift(s); return; }
    case 'copy': {
      const t = scheduleText(curDate, day);
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy as text', 1500); }, () => prompt('Copy the schedule:', t));
      return;
    }
    case 'print':
      $('#printArea').innerHTML = `<h2 style="margin:0 0 6px;font-size:16px">Work schedule – ${esc(fmtDate(curDate))}</h2>${gridHTML(day, computeNeed(curDate, day, false), computeCover(day), true)}`;
      window.print(); return;
    // setup
    case 'sp-add': {
      const name = $('#newSp').value.trim(); if (!name) return;
      const i = C.salesPoints.length;
      const nid = uid();
      C.salesPoints.push({id: nid, name, type: 'restaurant', color: COLORS[i % COLORS.length], hours: defWeek('11:30', '22:00'), baseStaff: 2, prepMin: 30, closeMin: 30, bookingTypes: []});
      C.positions.push(POS(nid + '-all', nid, name));
      saveConfig(); render(); return;
    }
    case 'sp-del': {
      const sp = spById(id); if (!confirm(`Delete ${sp.name}? Its shifts and bookings will no longer count.`)) return;
      C.salesPoints = C.salesPoints.filter(s => s.id !== id);
      const gone = new Set(C.positions.filter(p => p.sp === id).map(p => p.key));
      C.positions = C.positions.filter(p => p.sp !== id);
      C.employees.forEach(e => { e.allowed = e.allowed.filter(x => !gone.has(x)); if (e.headAt === id) e.headAt = null; });
      saveConfig(); render(); return;
    }
    case 'bt-add': { const sp = spById(id); sp.bookingTypes.push(BT(uid(), 'New type', '12:00', '14:00')); saveConfig(); render(); return; }
    case 'bt-del': { const sp = spById(id), t = sp.bookingTypes[+b.dataset.i]; if (!confirm(`Remove booking type "${t.label}"?`)) return; sp.bookingTypes.splice(+b.dataset.i, 1); saveConfig(); render(); return; }
    case 'sp-copyhours': { const sp = spById(id); WD.forEach(d => sp.hours[d] = {...sp.hours.mon}); saveConfig(); render(); return; }
    case 'emp-add': {
      const name = $('#newEmp').value.trim(); if (!name) return;
      C.employees.push({id: uid(), name, headAt: null, allowed: C.positions.map(p => p.key)});
      saveConfig(); render(); $('#newEmp').focus(); return;
    }
    case 'emp-del': { const em = empById(id); if (!confirm(`Delete ${em.name}?`)) return; C.employees = C.employees.filter(x => x.id !== id); saveConfig(); render(); return; }
    // sync
    case 'fb-connect': {
      const txt = $('#fbCfg').value; const a = txt.indexOf('{'), z = txt.lastIndexOf('}');
      let c; try { c = Function('"use strict";return (' + txt.slice(a, z + 1) + ')')(); } catch (err) { alert('That doesn\'t look like a firebaseConfig object.'); return; }
      if (!c || !c.apiKey || !c.projectId) { alert('The config needs at least apiKey and projectId.'); return; }
      localStorage.setItem(LSFB, JSON.stringify(c)); fbStart(); render(); return;
    }
    case 'fb-disconnect': if (confirm('Stop syncing in this browser? Data already saved here stays.')) { localStorage.removeItem(LSFB); location.reload(); } return;
    case 'fb-login': FB.auth.signInWithEmailAndPassword($('#fbEmail').value.trim(), $('#fbPw').value).catch(err => alert(err.message)); return;
    case 'fb-logout': FB.auth.signOut(); return;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'staff-scheduler-backup-' + todayStr() + '.json'; a.click(); return;
    }
    case 'import': $('#importFile').click(); return;
    default: return;
  }
  saveDay(curDate); render();
});

document.addEventListener('change', e => {
  const el = e.target, ch = el.dataset.ch; if (!ch) return;
  const C = cfg(), id = el.dataset.id, f = el.dataset.f;
  if (ch === 'date') { if (el.value) setDate(el.value); return; }
  if (ch === 'book') return; // handled on 'input' below, without redrawing the page
  if (ch === 'sp-flag') { spById(id)[f] = el.checked ? 1 : 0; saveConfig(); scheduleRender(); return; }
  if (ch === 'paxr') { const r = spById(id).paxRules[+el.dataset.i]; r[f] = Math.max(0, parseInt(el.value, 10) || 0); saveConfig(); scheduleRender(); return; }
  if (ch === 'pax') return; // saved on input
  if (ch === 'port') { const day = getDay(curDate); day.port = {...portFor(curDate, day), [f]: el.value || null}; saveDay(curDate); scheduleRender(); return; }
  if (ch === 'portw') { C.port[el.dataset.d] = {...(C.port[el.dataset.d] || {}), [f]: el.value || null}; saveConfig(); scheduleRender(); return; }
  if (ch === 'dock') { C.dockRule[f] = Math.max(0, parseFloat(el.value) || 0); saveConfig(); scheduleRender(); return; }
  if (ch === 'clean') { const sp = spById(id); sp.closedClean = {from: '12:00', to: '17:00', on: false, ...(sp.closedClean || {}), [f]: f === 'on' ? el.checked : el.value}; saveConfig(); scheduleRender(); return; }
  if (ch === 'mprep') { const sp = spById(id); sp.morningPrep = {...(sp.morningPrep || {}), [f]: Math.max(0, parseFloat(el.value) || 0)}; saveConfig(); scheduleRender(); return; }
  if (ch === 'per') { const t = hoursTarget(el); t.h.periods[+el.dataset.i][f] = el.value; t.commit(); return; }
  if (ch === 'bt') {
    const t = spById(id).bookingTypes[+el.dataset.i];
    t[f] = f === 'perStaff' ? Math.max(0, parseInt(el.value, 10) || 0) : (f === 'label' ? (el.value.trim() || t.label) : el.value);
  }
  else if (ch === 'rule') { C.rules[f] = Math.max(f === 'minRestH' ? 0 : 0.5, parseFloat(el.value) || 0); }
  else if (ch === 'meal') { C.rules.meals[+el.dataset.i][f] = el.value; }
  else if (ch === 'sp') { const sp = spById(id); sp[f] = ['name', 'type', 'color'].includes(f) ? el.value : Math.max(0, parseFloat(el.value) || 0); }
  else if (ch === 'emp') { const em = empById(id); em[f] = f === 'headAt' ? (el.value || null) : el.value; if (f === 'headAt' && em.headAt && !empMask({...em, headAt: null}, em.headAt).some(Boolean)) em.allowed.push(...C.positions.filter(p => p.sp === em.headAt).map(p => p.key)); }
  else if (ch === 'emp-rank') { const em = empById(id); em[f] = el.checked; }
  else if (ch === 'emp-allowed') { const em = empById(id), k = el.dataset.p; em.allowed = el.checked ? [...new Set([...em.allowed, k])] : em.allowed.filter(x => x !== k); }
  else if (ch === 'pos') { const ps = C.positions[+el.dataset.i]; ps[f] = f === 'label' ? (el.value.trim() || ps.label) : el.value; }
  else return;
  saveConfig(); scheduleRender();
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ch === 'pax') {
    const day = getDay(curDate); day.pax = Math.max(0, parseInt(el.value, 10) || 0); saveDay(curDate);
    const hint = $('#pax-hint'); if (hint) hint.innerHTML = 'Minimum staff morning/day/night: ' + paxSummary(day);
    const r = $('#dayResults'); if (r) r.innerHTML = dayResultsHTML(day);
    return;
  }
  if (el.dataset.ch !== 'book') return;
  const day = getDay(curDate), sp = spById(el.dataset.sp), n = Math.max(0, parseInt(el.value, 10) || 0);
  day.bookings[sp.id] = {...(day.bookings[sp.id] || {}), [el.dataset.k]: n};
  saveDay(curDate);
  const bk = day.bookings[sp.id], total = sp.bookingTypes.reduce((a, t) => a + (+bk[t.key] || 0), 0);
  const tEl = document.getElementById('bk-total-' + sp.id); if (tEl) tEl.textContent = total ? total + ' booked' : '';
  const r = $('#dayResults'); if (r) r.innerHTML = dayResultsHTML(day);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.dataset.ch === 'book') {
    e.preventDefault();
    const boxes = [...document.querySelectorAll('[data-ch="book"]')], i = boxes.indexOf(e.target);
    (boxes[i + 1] || e.target).focus(); if (!boxes[i + 1]) e.target.blur();
    return;
  }
  const map = {newEmp: 'emp-add', newSp: 'sp-add', fbPw: 'fb-login'};
  const act = map[e.target.id]; if (act) { e.preventDefault(); document.querySelector(`[data-act="${act}"]`).click(); }
});

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!s.config || !s.days) throw new Error();
    if (!confirm('Replace all current data with this backup?')) return;
    state = s; saveConfig(); Object.keys(state.days).forEach(saveDay); render();
  } catch (err) { alert('That file is not a scheduler backup.'); }
  e.target.value = '';
});

/* ============ Firebase sync (optional) ============ */
const FB = {status: 'local', err: '', auth: null, db: null, user: null, unsubCfg: null, unsubDay: null};
let cfgTimer = null, pendingCfg = false; const dayTimers = {}, pendingDay = {};
function fbCfg() { try { return JSON.parse(localStorage.getItem(LSFB)); } catch (e) { return null; } }
const online = () => FB.status === 'online' && FB.db && FB.user;
function fbError(err) { FB.status = 'error'; FB.err = err && err.message || String(err); renderBadge(); if (view === 'sync') renderSync(); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }

async function fbStart() {
  const c = fbCfg(); if (!c) return;
  FB.status = 'connecting'; renderBadge();
  try {
    const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    if (!window.firebase) await loadScript(base + 'firebase-app-compat.js');
    await loadScript(base + 'firebase-auth-compat.js');
    await loadScript(base + 'firebase-firestore-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(c);
    FB.db = firebase.firestore(); FB.auth = firebase.auth();
    FB.auth.onAuthStateChanged(u => {
      FB.user = u; FB.err = '';
      if (u) { FB.status = 'online'; subscribe(); } else { FB.status = 'signin'; unsubscribe(); }
      render();
    });
  } catch (err) { fbError(err); }
}
function unsubscribe() { if (FB.unsubCfg) FB.unsubCfg(); if (FB.unsubDay) FB.unsubDay(); FB.unsubCfg = FB.unsubDay = null; }
function subscribe() {
  unsubscribe();
  FB.unsubCfg = FB.db.collection('scheduler').doc('config').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || pendingCfg) return;
    if (snap.exists && snap.data().config) { state.config = snap.data().config; if (ensureConfig(state.config)) saveConfig(); else saveLocal(); render(); }
    else saveConfig(); // first device to connect uploads its setup
  }, fbError);
  subscribeDay();
}
function subscribeDay() {
  if (FB.unsubDay) FB.unsubDay(); FB.unsubDay = null;
  if (!online()) return;
  const date = curDate;
  FB.unsubDay = FB.db.collection('scheduler').doc('day-' + date).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || pendingDay[date]) return;
    if (snap.exists && snap.data().day) { state.days[date] = snap.data().day; saveLocal(); if (date === curDate) render(); }
    else if (state.days[date] && (state.days[date].working.length || state.days[date].shifts.length || Object.keys(state.days[date].bookings || {}).length)) saveDay(date);
  }, fbError);
}
function saveConfig() {
  saveLocal(); if (!online()) return;
  pendingCfg = true; clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => {
    FB.db.collection('scheduler').doc('config').set({config: clone(state.config), updated: Date.now()})
      .catch(fbError).finally(() => pendingCfg = false);
  }, 500);
}
function saveDay(date) {
  saveLocal(); if (!online() || !state.days[date]) return;
  pendingDay[date] = true; clearTimeout(dayTimers[date]);
  dayTimers[date] = setTimeout(() => {
    FB.db.collection('scheduler').doc('day-' + date).set({day: clone(state.days[date]), updated: Date.now()})
      .catch(fbError).finally(() => pendingDay[date] = false);
  }, 400);
}

render();
fbStart();
</script>
