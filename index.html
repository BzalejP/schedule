<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Scheduler</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#15181d;--muted:#667085;--line:#e3e6eb;--accent:#1d4ed8;--accent-ink:#fff;--bad:#c81e1e;--bad-bg:#fde8e8;--ok-bg:#e9f7ef;--over-bg:#eef2ff;--warn:#a15c07;--warn-bg:#fff4e0;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--ink:#e8eaed;--muted:#98a2b3;--line:#2a2f37;--accent:#60a5fa;--accent-ink:#0b1220;--bad:#f87171;--bad-bg:#3a1616;--ok-bg:#13261b;--over-bg:#1c2240;--warn:#fbbf24;--warn-bg:#2d2310;--chip:#242932}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.big{padding:9px 16px;font-weight:600}
button.danger{color:var(--bad)}
button.link{background:none;border:none;padding:2px 4px;color:var(--accent)}
button.x{background:none;border:none;padding:0 4px;color:var(--muted)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
input[type=checkbox]{padding:0}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:4px}
nav button{background:none;border-color:transparent}
nav button.active{background:var(--chip);border-color:var(--line);font-weight:600}
.badge{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.badge.online{background:var(--ok-bg);color:inherit}
.badge.error,.badge.signin{background:var(--warn-bg);color:var(--warn)}
main{padding:16px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted);font-weight:400}
.spacer{flex:1}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.datebar .wd{font-size:18px;font-weight:600;margin-left:6px}
.day-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:950px){.day-grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h3 .acts{margin-left:auto;display:flex;gap:4px}
.card h3 .acts button{padding:3px 8px;font-size:12px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:99px;padding:5px 11px;background:var(--panel)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{opacity:.8}
.hrow{display:flex;align-items:center;gap:6px;padding:4px 0;flex-wrap:wrap}
.hrow{flex-wrap:nowrap}
.paxrow{margin:0 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.paxrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.paxrow input{width:110px;font-size:15px}
.paxrow .muted{font-size:12px;margin-top:4px}
.bookrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-left:16px}
.book{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.book input{width:100%;font-size:15px;color:var(--ink)}
.hblock{padding:4px 0;border-bottom:1px dashed var(--line)}
.hblock:last-child{border-bottom:none}
.periods{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-left:16px}
.per{display:flex;align-items:center;gap:3px}
.per select{padding:3px 2px;font-size:13px}
.hrow select{padding:3px 2px;font-size:13px}
.hname{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.addrow input:not([type=number]){flex:1;min-width:90px}
.grp{margin-top:8px}
.grp-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:2px}
.li{display:flex;align-items:center;gap:8px;padding:3px 0 3px 16px;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:none}
.li .warn{color:var(--warn);font-size:12px}
.li .x{margin-left:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.alerts{margin-bottom:10px;display:flex;flex-direction:column;gap:5px}
.alert{padding:7px 11px;border-radius:8px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--chip)}
.tl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tl-row{display:grid;grid-template-columns:var(--cols);align-items:center;min-height:30px}
.tl-head{position:sticky;top:0;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.tl-time{border-left:1px solid var(--line);padding-left:3px;height:20px}
.tl-time.half{border-left-style:dotted}
.tl-lab{padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tl-sp{display:flex;align-items:center;gap:8px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.tl-sp:first-of-type{border-top:none}
.tl-bar{height:24px;border-radius:6px;background:var(--c);color:#fff;font-size:12px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tl-bar b{font-weight:700}
.tl-bar[data-ink="#1a1a1a"]{color:#1a1a1a}
.tl-lab{display:flex;align-items:center;gap:6px}
.tl-lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab .hrs{margin-left:auto;font-size:11px;color:var(--muted);padding-right:4px}
.tl-lab .star{color:#d97706}
.tl-row:not(.tl-head):not(.tl-cov):hover{background:var(--chip)}
.tl-bar span{opacity:.85}
.tl-brk{height:24px;z-index:2;pointer-events:none;position:relative}
.tl-brk::after{content:'';position:absolute;left:2px;right:2px;bottom:2px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 4px,rgba(255,255,255,.4) 4px 7px)}
.tl-bar{position:relative}
.signrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px}
.chip.small{padding:2px 9px;font-size:12px}
.tl-cov{min-height:24px}
.cov{font-size:10.5px;text-align:center;height:22px;line-height:22px;border-left:1px solid var(--panel)}
.cov.short{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cov.ok{background:var(--ok-bg)}
.cov.over{background:var(--over-bg)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
@media (max-width:500px){.setup-grid{grid-template-columns:1fr}}
.sp-top{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.sp-top input[type=text]{flex:1;font-weight:600}
.sp-top input[type=color]{width:34px;height:30px;padding:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px}
.fields label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.fields input{width:70px}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px}
.allowed{display:flex;flex-wrap:wrap;gap:4px 10px}
.pgrp{display:inline-flex;gap:8px;align-items:center;padding:2px 8px;border:1px solid var(--line);border-radius:7px}
.pgrp b{font-size:12px;font-weight:600}
.pgrp.backup{background:var(--chip)}
.allowed label{font-size:12px;display:flex;gap:3px;align-items:center;white-space:nowrap}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
pre.code{background:var(--chip);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px}
dialog label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-bottom:10px}
dialog .row{display:flex;gap:10px}
dialog .row label{flex:1}
.dlg-actions{display:flex;gap:8px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--panel)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.gwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.sgrid{border-collapse:collapse;table-layout:fixed;width:max-content;font-size:12px;color:#1a1a1a}
.sgrid col.c-name{width:120px}.sgrid col.c-slot{width:20px}.sgrid col.c-num{width:66px}
.sgrid td,.sgrid th{border:1px solid #9a9a9a;padding:0;height:22px;background:#fff}
.sgrid td.hr,.sgrid th.hr{border-left-color:#555}
.sgrid thead th{background:#a6a6a6;color:#1a1a1a;font-weight:700}
.sgrid thead th.slot{height:92px;vertical-align:bottom}
.sgrid thead th.slot span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;font-size:10.5px;padding:4px 0;white-space:nowrap}
.sgrid thead th.num{font-size:12px;line-height:1.1}
.sgrid thead th.corner{background:#d9d9d9}
.sgrid th.name{text-align:left;font-weight:400;color:#1a1a1a;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:1}
.sgrid .star{color:#c55a11}.sgrid .tag.mgr{background:#d9d9d9}.sgrid .tag{font-size:10px;background:#ffe699;border-radius:3px;padding:0 3px}
.sgrid td[data-act]{cursor:pointer}
.sgrid td[data-act]:hover{outline:2px solid #1a1a1a;outline-offset:-2px}
.sgrid td.num{text-align:center;font-weight:700}
.sgrid td.num.ok{background:#00B050;color:#fff}
.sgrid td.num.off{background:#FFFF00}
.sgrid td.num.rest{background:#fff}
.sgrid.cov td{font-size:10px;text-align:center;color:#555}
.sgrid.cov td.short{background:#fde8e8;color:#c81e1e;font-weight:700}
.sgrid.cov td.ok{background:#e9f7ef}
.sgrid.cov td.over{background:#eef2ff}
.sgrid .dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 2px;font-size:12px;color:var(--ink)}
.glegend span{display:flex;align-items:center;gap:6px;font-weight:600}
.glegend i{display:inline-block;width:42px;height:14px;border:1px solid #9a9a9a}
.gcov{margin-top:10px}.gcov summary{cursor:pointer;font-size:13px;color:var(--muted)}
.gcov .sgrid{margin-top:6px}
#printArea{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff;color:#000}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea pre{font-size:13px}
  #printArea .gwrap{border:none;padding:0;overflow:visible}
  #printArea .sgrid{width:100%}
  #printArea .sgrid col.c-name{width:9%}#printArea .sgrid col.c-slot{width:1.7%}#printArea .sgrid col.c-num{width:4.6%}
  #printArea .sgrid td.num{font-size:11px}
  #printArea .sgrid td,#printArea .sgrid th{height:18px}
  #printArea .sgrid thead th.slot{height:70px}#printArea .sgrid thead th.slot span{font-size:8px}
  .sgrid td,.sgrid th,.glegend i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tl-wrap{border:none;overflow:visible}
  .tl-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cov{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1>Staff Scheduler</h1>
  <nav>
    <button data-act="view" data-v="day">Day</button>
    <button data-act="view" data-v="setup">Setup</button>
    <button data-act="view" data-v="sync">Sync &amp; backup</button>
  </nav>
  <span id="badge" class="badge">Local only</span>
</header>
<main>
  <section id="view-day"></section>
  <section id="view-setup" hidden></section>
  <section id="view-sync" hidden></section>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle">Shift</h3>
    <label>Employee <select name="emp"></select></label>
    <label>Sales point <select name="sp"></select></label>
    <div class="row">
      <label>Start <select name="start"></select></label>
      <label>End <select name="end"></select></label>
    </div>
    <div class="dlg-actions">
      <button type="button" id="dlgDel" class="danger">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="dlgCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="printArea"></div>

<script>
/* ============ Basics ============ */
const SLOTS = 48;          // 30-minute slots in a scheduling day
const DAY0 = 5 * 60;       // the scheduling day runs 05:00 -> 05:00 next morning
const WD = ['mon','tue','wed','thu','fri','sat','sun'];
const WDL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const LS = 'staffsched.state.v1', LSFB = 'staffsched.firebase.v1';
const COLORS = ['#9DC3E6','#00B050','#7030A0','#FFFF00','#0070C0','#00B0F0','#C55A11','#808080'];
// Colours from the paper schedule
const SHEET_COLORS = {laterna: '#9DC3E6', undirhusid: '#00B050', munkastova: '#7030A0', noatun: '#FFFF00', skansagardur: '#0070C0', placeur: '#00B0F0'};
const BREAK_COLOR = '#FF66CC';
// Dark or white text, whichever reads better on a colour
function inkOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff';
  const n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1a1a1a' : '#fff';
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));

const toSlot = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return Math.floor((((h*60 + m) - DAY0 + 1440) % 1440) / 30); };
const endSlot = t => { const s = toSlot(t); return s === 0 ? SLOTS : s; };
const slotTime = i => { const m = (DAY0 + i*30) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); };
const timeOpts = sel => { let o = ''; for (let i = 0; i < SLOTS; i++) { const t = slotTime(i); o += `<option${t===sel?' selected':''}>${t}</option>`; } return o; };
const endOpts = sel => { let o = ''; for (let i = 1; i <= SLOTS; i++) { const t = slotTime(i); o += `<option${t===sel?' selected':''}>${t}</option>`; } return o; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const wdIndex = ds => (new Date(ds + 'T12:00:00').getDay() + 6) % 7;
const fmtDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

/* ============ Opening hours ============ */
// A day's hours = list of opening periods; no periods = closed.
const P = (...pairs) => ({periods: pairs.map(([open, close]) => ({open, close}))});
const CLOSED = () => ({periods: []});
function normHours(h) {
  if (!h) return CLOSED();
  if (Array.isArray(h.periods)) return {periods: h.periods.map(p => ({open: p.open, close: p.close}))};
  return h.closed ? CLOSED() : P([h.open || '12:00', h.close || '22:00']); // old single-period format
}
const hoursLabel = h => h.periods.length ? h.periods.map(p => p.open + '–' + p.close).join(', ') : 'closed';
const isOpenAt = (h, s) => h.periods.some(p => s >= toSlot(p.open) && s < endSlot(p.close));
function defWeek(open, close) { const h = {}; WD.forEach(d => h[d] = P([open, close])); return h; }

// M/F Norröna shoulder season (15.03–30.05.2026 & 05.09–22.11.2026), ship time.
// "?" closing times on the sheet are entered as LATE.
const LATE = '02:30';
const NORRONA_PRESET = 'norrona-shoulder-2026b';
const NORRONA_SHOULDER = {
  undirhusid: {mon: P(['09:00', LATE]), tue: P(['10:00', LATE]), wed: P(['17:00', LATE]), thu: P(['17:00', LATE]),
               fri: P(['09:00', LATE]), sat: P(['09:00', LATE]), sun: P(['12:00', LATE])},
  laterna:    {mon: P(['08:00', LATE]), tue: P(['07:00', LATE]), wed: P(['07:00', '10:00'], ['17:00', LATE]), thu: P(['17:00', LATE]),
               fri: P(['08:00', LATE]), sat: P(['08:00', LATE]), sun: P(['07:00', '10:00'], ['12:30', LATE])},
  noatun:     {mon: P(['07:00', '21:00']), tue: P(['06:00', '21:00']), wed: P(['07:00', '18:00']), thu: P(['07:00', '22:00']),
               fri: P(['07:00', '22:00']), sat: P(['07:00', '21:00']), sun: P(['07:00', '10:00'], ['12:30', '21:00'])},
  munkastova: {mon: P(['12:00', '14:00'], ['17:30', '21:00']), tue: P(['13:00', '15:00'], ['17:30', '21:00']), wed: CLOSED(),
               thu: P(['18:00', '21:30']), fri: P(['12:00', '14:00'], ['18:00', '21:30']), sat: P(['12:00', '14:00'], ['17:30', '21:00']),
               sun: P(['17:30', '21:00'])},
  // Buffet (breakfast + dinner)
  skansagardur: {mon: P(['07:00', '10:00'], ['17:30', '21:00']), tue: P(['06:00', '09:00'], ['17:30', '21:00']),
                 wed: P(['07:00', '10:00'], ['18:30', '22:00']), thu: P(['07:00', '10:00'], ['18:30', '22:00']),
                 fri: P(['07:00', '10:00'], ['18:00', '21:30']), sat: P(['07:00', '10:00'], ['17:30', '21:00']),
                 sun: P(['07:00', '10:00'], ['17:30', '21:00'])}
};
function applyNorrona(c) {
  c.salesPoints.forEach(sp => { if (NORRONA_SHOULDER[sp.id]) sp.hours = clone(NORRONA_SHOULDER[sp.id]); });
  c.hoursPreset = NORRONA_PRESET;
}
// Booking types per sales point. Each type has a time window; booked guests in that window add
// +1 staff for every full "perStaff" guests (0 = doesn't affect staffing).
const BT = (key, label, from, to, perStaff = 20) => ({key, label, from, to, perStaff});
const DEFAULT_BOOKING_TYPES = {
  noatun: [BT('breakfast', 'Breakfast', '07:00', '10:00'), BT('lunch', 'Lunch', '12:00', '14:00'),
           BT('dinner', 'Dinner', '18:00', '20:00'), BT('driver', 'Driver meal', '18:00', '20:00')],
  skansagardur: [BT('breakfast', 'Breakfast', '07:00', '10:00'), BT('lunch', 'Lunch', '12:00', '14:00'),
                 BT('dinner', 'Dinner', '18:00', '21:00')],
  munkastova: [BT('lunch', 'Lunch', '12:00', '14:00'), BT('dinner', 'Dinner', '18:00', '21:00'),
               BT('fruit', 'Fruit basket', '15:00', '17:00', 0)]
};
// Work positions: what an employee can be scheduled for. Each belongs to one sales point and
// covers a part of the day; "05:00"–"05:00" = the whole day.
const POS = (key, sp, label, from = '05:00', to = '05:00') => ({key, sp, label, from, to});
const DEFAULT_POSITIONS = [
  ...[['laterna', 'Laterna Magica'], ['undirhusid', 'Undirhusid'], ['noatun', 'Noatun']].flatMap(([id, name]) => [
    POS(id + '-morning', id, name + ' morning', '05:00', '12:00'),

/* ============ Demand: staff needed per 30-min slot ============ */
// planning=true: the generator's target (one extra during staff meals so breaks can be taken).
// planning=false: what must actually be on the floor (used for warnings and the staff on/needed numbers).
function computeNeed(date, day, planning = true) {
  const need = {};
  for (const sp of cfg().salesPoints) {
    const arr = new Array(SLOTS).fill(0);
    need[sp.id] = arr;
    const h = spHours(sp, date, day);
    if (!h.periods.length) {
      const cc = sp.closedClean; // closed today: one person for cleaning
      if (cc && cc.on) for (let s = toSlot(cc.from); s < endSlot(cc.to); s++) arr[s] = 1;
      continue;
    }
    const pre = Math.ceil((+sp.prepMin || 0) / 30), post = Math.ceil((+sp.closeMin || 0) / 30);
    const base = Math.max(1, +sp.baseStaff || 1);
    const open = new Array(SLOTS).fill(false);
    h.periods.forEach(p => {
      const o = toSlot(p.open), c = endSlot(p.close); if (c <= o) return;
      for (let s = o; s < c; s++) open[s] = true;
      // morning services (opening before 12:00) can have their own arrive/stay times
      const mp = sp.morningPrep && o < toSlot('12:00') ? sp.morningPrep : null;
      const b4 = mp ? Math.ceil((+mp.before || 0) / 30) : pre, af = mp ? Math.ceil((+mp.after || 0) / 30) : post;
      for (let s = Math.max(0, o - b4); s < Math.min(SLOTS, c + af); s++) arr[s] = base;
    });
    // Passengers: minimum staff per shift while open
    if ((sp.paxRules || []).length) {
      const row = paxRow(sp, day.pax);
      PAX_SHIFTS.forEach(k => { const [a, b] = shiftWin(sp.id, k), mn = +row[k] || 0;
        for (let s = a; s < b; s++) if (arr[s] > 0) arr[s] = Math.max(1, mn); }); // replaces 'staff whenever open'
    }
    const dr = cfg().dockRule;
    // Port calls: at least "people" staff around arrival/departure, only when passengers are above "minPax"
    if (dr && dr.sp === sp.id && +dr.people > 0 && (+day.pax || 0) > (+dr.minPax || 0)) {
      const pc = portFor(date, day), add = (a, b) => { for (let s = Math.max(0, a); s < Math.min(SLOTS, b); s++) arr[s] = Math.max(arr[s], +dr.people); };
      if (pc.arr) add(toSlot(pc.arr) - Math.round(dr.beforeArrMin / 30), toSlot(pc.arr));
      if (pc.dep) add(toSlot(pc.dep), toSlot(pc.dep) + Math.round(dr.afterDepMin / 30));
    }
    // Bookings: +1 staff for every full "perStaff" guests, during that booking type's window, while open
    const bk = day.bookings[sp.id] || {};
    (sp.bookingTypes || []).forEach(t => {
      const add = +t.perStaff > 0 ? Math.floor((+bk[t.key] || 0) / +t.perStaff) : 0;
      if (add) for (let s = toSlot(t.from); s < endSlot(t.to); s++) if (open[s]) arr[s] += add;
    });
    if (+sp.maxStaff > 0) for (let s = 0; s < SLOTS; s++) arr[s] = Math.min(arr[s], +sp.maxStaff);
    // Staff meals: plan one extra person so breaks never leave the place below its minimum
    if (+sp.mealCover > 0 && planning) (R().meals || []).forEach(m => {
      for (let s = toSlot(m.from); s < endSlot(m.to); s++) if (arr[s] > 0) arr[s] += 1;
    });
  }

}
function computeCover(day, date = curDate) {
  const cover = {};
  cfg().salesPoints.forEach(sp => cover[sp.id] = new Array(SLOTS).fill(0));
  day.shifts.forEach(s => { if (cover[s.sp]) for (let k = s.start; k < s.end; k++) cover[s.sp][k]++; });
  // a break only takes someone off the floor while the place is open; during closed/prep time it costs nothing
  const hrs = {};
  (day.breaks || []).forEach(b => { if (!cover[b.sp]) return; const h = hrs[b.sp] ||= spHours(spById(b.sp), date, day);
    for (let k = b.slot; k < b.slot + b.len; k++) if (isOpenAt(h, k)) cover[b.sp][k]--; });

}

  const out = []; let s = 0;
  while (s < SLOTS) {
    if (n[s] > c[s]) { let e = s, max = 0; while (e < SLOTS && n[e] > c[e]) { max = Math.max(max, n[e] - c[e]); e++; } out.push({s, e, max}); s = e; }

}

/* ============ Working-time rules ============ */
const R = () => cfg().rules;
const targetSlots = (e, day) => Math.round(((day.signing || []).includes(e.id) ? R().signHours : R().dayHours) * 2);
const minGapSlots = () => Math.max(1, Math.round(R().minSplitH * 2)); // break between the two parts of a day
const minPartSlots = () => Math.max(1, Math.round(R().minShiftH * 2));
// Earliest slot today that still gives the minimum rest after yesterday's last shift.
function earliestStart(e, date) {
  const prev = state.days[addDays(date, -1)];
  if (!prev || !prev.shifts) return 0;
  const ends = prev.shifts.filter(s => s.emp === e.id).map(s => s.end); if (!ends.length) return 0;
  return Math.max(0, Math.round(R().minRestH * 2) - (SLOTS - Math.max(...ends)));
}
// An employee's working blocks today (touching shifts merged), sorted.
function workBlocks(day, empId) {
  const sh = day.shifts.filter(s => s.emp === empId).sort((a, b) => a.start - b.start), out = [];
  sh.forEach(s => { const last = out[out.length - 1]; if (last && s.start <= last.end) last.end = Math.max(last.end, s.end); else out.push({start: s.start, end: s.end}); });
  return out;
}

// Meal breaks: anyone working through a meal window gets a break inside it, at the slot
// where their sales point can best spare them. Breaks count as part of the shift.
function placeBreaks(date, day) {
  const need = computeNeed(date, day), floor = computeNeed(date, day, false), notes = [];
  day.breaks = [];
  const cover = computeCover(day, date);
  const bl = Math.max(1, Math.ceil(R().mealBreakMin / 30));
  cfg().employees.forEach(e => {
    const mine = day.shifts.filter(s => s.emp === e.id); if (!mine.length) return;
    R().meals.forEach(m => {
      const wS = toSlot(m.from), wE = endSlot(m.to);
      const at = k => mine.find(s => k >= s.start && k < s.end);
      let free = 0, ok = false;
      for (let k = wS; k < wE; k++) { if (at(k)) free = 0; else if (++free >= bl) ok = true; }
      if (ok || !mine.some(s => s.start < wE && s.end > wS)) return; // already free during the meal
      let bestB = null;
      for (let k = wS; k + bl <= wE; k++) {
        const s = at(k); if (!s) continue;
        let fits = true, spare = 0;
        const oh = spHours(spById(s.sp), date, day);
        for (let j = k; j < k + bl; j++) { const t = at(j); if (!t || t.sp !== s.sp) fits = false; else spare += isOpenAt(oh, j) ? cover[s.sp][j] - need[s.sp][j] : 1000; } // closed/prep time: best
        const mc = +(spById(s.sp) || {}).mealCover || 0;
        if (fits && mc) for (let j = k; j < k + bl; j++) if (isOpenAt(oh, j) && cover[s.sp][j] - 1 < floor[s.sp][j]) spare -= 100; // would leave it below its minimum
        if (fits && (!bestB || spare > bestB.spare)) bestB = {slot: k, sp: s.sp, spare};
      }
      if (!bestB) { notes.push(`${e.name} has no room for a ${m.label.toLowerCase()} break.`); return; }
      day.breaks.push({emp: e.id, sp: bestB.sp, slot: bestB.slot, len: bl, meal: m.label});
      { const oh = spHours(spById(bestB.sp), date, day); for (let j = bestB.slot; j < bestB.slot + bl; j++) if (isOpenAt(oh, j)) cover[bestB.sp][j]--; }
    });
  });
  day.breakNotes = notes;
}

// Signing off: leaves when the ship docks, so works before arrival. Signing on: boards at arrival, works after.
function signWindow(e, date, day) {

function checkRules(date, day) {

    if ((day.signing || []).includes(e.id)) {
      const arr = portFor(date, day).arr, [w0, w1] = signWindow(e, date, day);
      if (!arr) out.push(`${e.name} ${signLabel(e, day)} today, but there is no port arrival (set it under Opening hours today).`);
      if (blocks.length > 1) out.push(`${e.name} ${signLabel(e, day)} today: the hours must be in a row, not split.`);
      const bad = blocks.find(b => b.start < w0 || b.end > w1);
      if (bad && arr) out.push(`${e.name} ${signLabel(e, day)} at ${arr} arrival, but works ${slotTime(bad.start)}–${slotTime(bad.end)}.`);
    }
    const total = blocks.reduce((a, b) => a + b.end - b.start, 0), want = targetSlots(e, day);
    if (isBackup(e)) { if (total > want) out.push(`${e.name} (${rankLabel(e).toLowerCase()}) works ${total / 2}h today (maximum ${want / 2}h).`); }
    else if (total !== want) out.push(`${e.name} works ${total / 2}h today (should be ${want / 2}h${(day.signing || []).includes(e.id) ? ', ' + signLabel(e, day).replace('signs', 'signing') : ''}).`);
    if (blocks.length > 2 && !isBackup(e)) out.push(`${e.name}'s day is split into ${blocks.length} parts (max 2).`);
    for (let i = 1; i < blocks.length; i++) {
      const gap = blocks[i].start - blocks[i - 1].end;
      if (gap < minGapSlots() && !isBackup(e)) out.push(`${e.name} has only a ${gap / 2}h break between shifts at ${slotTime(blocks[i - 1].end)}; it must be at least ${R().minSplitH}h.`);
    }
    const early = earliestStart(e, date);
    if (blocks[0].start < early) out.push(`${e.name} gets only ${(blocks[0].start + Math.round(R().minRestH * 2) - early) / 2}h rest after yesterday (minimum ${R().minRestH}h).`);
  });
  return out.concat(day.breakNotes || []);
}

// A fingerprint of a day's shifts, to notice when the day before changes after generating.
function shiftSig(date) {
  const d = state.days[date]; if (!d || !d.shifts) return '';
  return d.shifts.map(s => `${s.emp}:${s.sp}:${s.start}-${s.end}`).sort().join('|');
}

/* ============ Continuity: same people on the same jobs ============ */
const isRole = (s, spId, role) => s.sp === spId && (s.role === role || (role === 'open' && s.fixed === 'headwaiter') || (role === 'close' && s.fixed === 'closing'));
// Who did this job on the most recent days, and for how many days in a row.
function roleHolder(date, spId, role) {
  let holder = null, streak = 0;
  for (let i = 1; i <= 14; i++) {
    const d = state.days[addDays(date, -i)]; if (!d || !d.shifts || !d.shifts.length) continue;
    const s = d.shifts.find(x => isRole(x, spId, role) && !x.sub); if (!s) continue; // stand-ins don't count
    if (!holder) { holder = s.emp; streak = 1; } else if (s.emp === holder) streak++; else break;
  }
  return holder ? {emp: holder, streak} : null;
}
// The staff who worked at a sales point the last day it had a schedule.
function prevTeam(date, spId) {
  for (let i = 1; i <= 7; i++) {
    const d = state.days[addDays(date, -i)]; if (!d || !d.shifts) continue;
    const sh = d.shifts.filter(x => x.sp === spId).sort((a, b) => a.start - b.start);
    if (sh.length) return [...new Set(sh.map(x => x.emp))];
  }
  return [];
}

const empMaskBase = (e, spId) => empMask(e, spId);

/* ============ Schedule generator ============ */
function generate(date, day) {
  const {salesPoints: sps, employees} = cfg();
  const need = computeNeed(date, day);
  const cover = {}; sps.forEach(sp => cover[sp.id] = new Array(SLOTS).fill(0));
  const pool = employees.filter(e => day.working.includes(e.id) && !isBackup(e));
  const backups = employees.filter(e => day.working.includes(e.id) && isBackup(e));
  const used = new Set(), shifts = [], notes = [];
  const minPart = minPartSlots(), minGap = minGapSlots();
  // Within the generator, a signing person may only work before (off) / after (on) the ship's arrival.
  const empMask = (e, spId) => { const m = empMaskBase(e, spId), [w0, w1] = signWindow(e, date, day); return m.map((x, k) => x && k >= w0 && k < w1); };
  const inWindow = (e, a, b) => { const [w0, w1] = signWindow(e, date, day); return a >= w0 && b <= w1; };
  const oneBlock = e => (day.signing || []).includes(e.id);
  const isOpenDay = spId => spHours(spById(spId), date, day).periods.length > 0;
  const homeOpen = e => e.headAt && spById(e.headAt) && isOpenDay(e.headAt);
  const place = (e, spId, start, end, fixed, role) => {
    start = Math.max(0, start); end = Math.min(SLOTS, end); if (end <= start) return;
    shifts.push({id: uid(), emp: e.id, sp: spId, start, end, ...(fixed ? {fixed} : {}), ...(role ? {role} : {})});
    used.add(e.id);
    for (let k = start; k < end; k++) cover[spId][k]++;
  };
  const free = () => pool.filter(e => !used.has(e.id));
  const restOk = (e, start) => start >= earliestStart(e, date);

  // Best day plan for one employee: one block, or two blocks with a gap longer than the
  // allowed split, totalling their standard hours. Each block stays inside open time
  // at one sales point and inside their positions. homeWeight favours a headwaiter's place.
  // During a "closing shift alone" nobody else is added at that bar unless more staff is needed.
  const capWin = {};
  // closed places with a cleaning shift: exactly the cleaning person, nobody extra
  sps.forEach(sp => { if (!isOpenDay(sp.id) && need[sp.id].some(x => x > 0)) capWin[sp.id] = [0, SLOTS]; });
  function bestPlan(e, homeWeight, homeSp = e.headAt, ext = 6, mustHome = false) {
    const E = earliestStart(e, date), T = targetSlots(e, day);
    const info = sps.map(sp => {
      const m = empMask(e, sp.id), n = need[sp.id], c = cover[sp.id], home = homeWeight && sp.id === homeSp, w = home ? homeWeight : 1, cw = capWin[sp.id];
      // at their own place, headwaiters/team may stay up to 3h before or after it's busy, to make up their hours
      let lo = 0, hi = SLOTS;
      if (home) { const busy = n.map((x, i) => x > 0 ? i : -1).filter(i => i >= 0); if (busy.length) { lo = Math.max(0, busy[0] - ext); hi = Math.min(SLOTS, busy[busy.length - 1] + 1 + ext); } }
      const ok = k => k >= E && m[k] && (home ? k >= lo && k < hi : n[k] > 0) && !(cw && k >= cw[0] && k < cw[1] && n[k] - c[k] <= 0);
      const pre = [0]; for (let k = 0; k < SLOTS; k++) pre.push(pre[k] + (ok(k) && n[k] - c[k] > 0 ? w : 0));
      // how overstaffed a slot would become: used to spread extra people instead of piling them up
      const opre = [0]; for (let k = 0; k < SLOTS; k++) opre.push(opre[k] + (ok(k) && n[k] - c[k] <= 0 ? c[k] - n[k] + 1 : 0));
      const run = new Array(SLOTS + 1).fill(0); for (let k = SLOTS - 1; k >= 0; k--) run[k] = ok(k) ? run[k + 1] + 1 : 0;
      return {sp: sp.id, pre, opre, run};
    });
    // value of a block: covering short half hours first, then the least overstaffing
    const gain = (I, a, L) => I.run[a] >= L ? (I.pre[a + L] - I.pre[a]) * 100000 - (I.opre[a + L] - I.opre[a]) * 10 : -Infinity;
    for (let tot = T; tot >= Math.min(minPart, T); tot--) {
      let bp = null;
      const consider = (score, parts) => { if (mustHome && !parts.some(x => x.sp === homeSp && x.L > 0)) return; if (!bp || score > bp.score) bp = {score, parts, tot}; };
      for (const I of info) for (let a = 0; a + tot <= SLOTS; a++) { const g = gain(I, a, tot); if (g > -Infinity) consider(g + 1, [{sp: I.sp, a, L: tot}]); }
      for (let L1 = minPart; !oneBlock(e) && L1 <= tot - minPart; L1++) {
        const L2 = tot - L1, suf = new Array(SLOTS + 1).fill(null);
        for (let s = SLOTS - 1; s >= 0; s--) {
          suf[s] = suf[s + 1];
          for (const I of info) { const g = gain(I, s, L2); if (g > -Infinity && (!suf[s] || g > suf[s].g)) suf[s] = {g, sp: I.sp, a: s}; }
        }
        for (const I of info) for (let a = 0; a + L1 + minGap < SLOTS; a++) {
          const g = gain(I, a, L1); if (g === -Infinity) continue;
          const b = suf[a + L1 + minGap]; if (!b) continue;
          consider(g + b.g, [{sp: I.sp, a, L: L1}, {sp: b.sp, a: b.a, L: L2}]);
        }
      }
      if (bp) return bp;
    }
    return null;
  }
  const assignPlan = (e, plan) => {
    plan.parts.forEach(p => place(e, p.sp, p.a, p.a + p.L));
    if (plan.tot < targetSlots(e, day)) notes.push(`${e.name} only gets ${plan.tot / 2}h: not enough open hours in their positions.`);
  };

  // 0) Fixed rules, always applied first
  const nm = id => (empById(id) || {}).name || '?';
  const signing = new Set(day.signing || []);
  const flex = e => e.allowed.length;
  const FR = cfg().fixedRules || [];
  // People continuing a job from previous days are kept for that job.
  const reserved = new Map(); // empId -> rule
  const holders = new Map();  // rule -> {emp, streak}
  FR.forEach(r => {
    if (!r.keepWeek || !isOpenDay(r.sp)) return;
    const h = roleHolder(date, r.sp, r.type === 'opener' ? 'open' : 'close');
    if (!h) return; holders.set(r, h);
    if (h.streak < 7 && pool.some(e => e.id === h.emp)) reserved.set(h.emp, r);
  });
  FR.filter(r => r.type === 'team' && isOpenDay(r.sp)).forEach(r => {
    const lead = prevTeam(date, r.sp).find(id => pool.some(e => e.id === id && e.headAt === r.sp)) || (pool.find(e => e.headAt === r.sp) || {}).id;
    if (lead && !reserved.has(lead)) reserved.set(lead, r);
  });
  const notMine = (e, r) => reserved.has(e.id) && reserved.get(e.id) !== r;
  const firstOpenSlot = h => Math.min(...h.periods.map(p => toSlot(p.open)));
  const closerOf = spId => FR.find(r => r.type === 'closer' && r.sp === spId && r.alone);
  // closing shift ends at the rule's time, or earlier if the place closes earlier (plus "stay after closing")
  const closerEnd = (r, h) => { const sp = spById(r.sp), last = Math.max(...h.periods.map(p => endSlot(p.close)));
    return Math.min(endSlot(r.end), Math.min(SLOTS, last + Math.ceil((+sp.closeMin || 0) / 30))); };
  const holderNote = (r, e, what) => {
    const h = holders.get(r);
    if (h && h.streak < 7 && h.emp !== (e && e.id)) notes.push(`${nm(h.emp)} has ${what} ${spById(r.sp).name} ${h.streak} day${h.streak > 1 ? 's' : ''} in a row but can't today${e ? `; ${e.name} does it instead` : ''}.`);
  };
  const pickHolder = (r, cands) => { const h = holders.get(r); return h && h.streak < 7 ? cands.find(e => e.id === h.emp) : null; };

  const order = r => r.type === 'opener' ? (r.who === 'headwaiter' ? 0 : 2) : r.type === 'closer' ? 1 : r.type === 'team' ? 3 : 4;
  [...FR].sort((a, b) => order(a) - order(b)).forEach(r => {
    const sp = spById(r.sp); if (!sp) return;
    const cleaningDay = !isOpenDay(r.sp) && need[r.sp].some(x => x > 0);
    if (!isOpenDay(r.sp) && !(r.type === 'team' && cleaningDay)) return;
    const h = spHours(sp, date, day);
    if (r.type === 'opener') {
      const fixedStart = r.startAt && r.startAt[WD[wdIndex(date)]];
      const open = firstOpenSlot(h), start = fixedStart ? toSlot(fixedStart) : Math.max(0, open - Math.round(r.beforeMin / 30));
      if (!fixedStart && open - Math.round(r.beforeMin / 30) < 0) notes.push(`${sp.name} opening shift would start before 05:00; it starts at 05:00 instead.`);
      // evening opening: the closing shift covers the night alone, no separate opening shift
      const cr = closerOf(r.sp);
      // the closer arrives within an hour of the opener: one person covers it, no separate opening shift
      if (!fixedStart && cr && closerEnd(cr, h) - cr.hours * 2 <= start + 2) { notes.push(`${sp.name} opens in the evening today, so the closing shift covers it alone.`); return; }
      const base = e => restOk(e, start) && inWindow(e, start, start + Math.min(r.hours * 2, targetSlots(e, day))) && (r.who === 'headwaiter' ? e.headAt === r.sp : empMask(e, r.sp)[start] && !(homeOpen(e) && e.headAt !== r.sp));
      let cands = free().filter(base), e = pickHolder(r, cands);
      if (!e) {
        const pool2 = cands.filter(x => !notMine(x, r));
        pool2.sort((a, b) => (signing.has(a.id) - signing.has(b.id)) || (!!a.headAt - !!b.headAt) * (r.who === 'any' ? 1 : 0) || flex(a) - flex(b));
        e = pool2[0] || cands[0];
      }
      if (!e && r.who === 'headwaiter') { // no headwaiter in: anyone who may work there at that time
        const any = free().filter(x => restOk(x, start) && inWindow(x, start, start + Math.min(r.hours * 2, targetSlots(x, day))) && empMask(x, r.sp)[start] && !notMine(x, r) && !(homeOpen(x) && x.headAt !== r.sp)).sort((a, b) => flex(a) - flex(b));
        e = any[0]; if (e) notes.push(`No ${sp.name} headwaiter is in, so ${e.name} opens.`);
      }
      holderNote(r, e, 'opened');
      if (!e) { notes.push(`Nobody available to open ${sp.name} at ${slotTime(start)}.`); return; }
      place(e, r.sp, start, start + Math.min(r.hours * 2, targetSlots(e, day)), 'opening', 'open');
      const ho = holders.get(r); if (ho && ho.streak < 7 && ho.emp !== e.id) shifts[shifts.length - 1].sub = true;
    } else if (r.type === 'closer') {
      const end = closerEnd(r, h), start = end - r.hours * 2;
      if (end < endSlot(r.end)) notes.push(`${sp.name} closes at ${slotTime(Math.max(...h.periods.map(p => endSlot(p.close))))} today, so the closing shift ends at ${slotTime(end)}.`);
      const cands = free().filter(e => empMask(e, r.sp)[end - 1] && restOk(e, start) && targetSlots(e, day) >= r.hours * 2 && !(homeOpen(e) && e.headAt !== r.sp));
      let e = pickHolder(r, cands);
      if (!e) {
        const pool2 = cands.filter(x => !notMine(x, r));
        pool2.sort((a, b) => ((b.headAt === r.sp) - (a.headAt === r.sp)) || (!!a.headAt - !!b.headAt) || flex(a) - flex(b));
        e = pool2[0] || cands[0];
      }
      holderNote(r, e, 'closed');
      if (!e) { notes.push(`Nobody available to close ${sp.name} (${slotTime(start)}–${r.end}). Tick more people in, or give someone the ${sp.name} night position.`); return; }
      place(e, r.sp, start, end, 'closing', 'close');
      const hc = holders.get(r); if (hc && hc.streak < 7 && hc.emp !== e.id) shifts[shifts.length - 1].sub = true;
      if (r.alone) capWin[r.sp] = [Math.max(0, start), end];
    } else if (r.type === 'cover') {
      // mandatory: every open half hour covered, nobody beyond what's needed
      capWin[r.sp] = [0, SLOTS];
      const shortNow = () => need[r.sp].some((x, k) => x - cover[r.sp][k] > 0);
      const cands = () => free().filter(e => empMask(e, r.sp).some(Boolean) && !notMine(e, r) && !(homeOpen(e) && e.headAt !== r.sp))
        .sort((a, b) => (signing.has(a.id) - signing.has(b.id)) || flex(a) - flex(b));
      for (let g = 0; g < 6 && shortNow(); g++) {
        let best = null;
        for (const e of cands()) {
          const p = bestPlan(e, 50, r.sp, 0, true); if (!p) continue;
          const got = p.parts.filter(x => x.sp === r.sp).reduce((a, x) => a + x.L, 0);
          if (!best || got > best.got) best = {e, p, got};
        }
        if (!best) break;
        assignPlan(best.e, best.p);
      }
      if (shortNow()) notes.push(`${sp.name} can't be fully covered: not enough people with the ${sp.name} position are in. Tick the ${sp.name} position for more staff in Setup.`);
    } else if (r.type === 'team') {
      const can = e => empMask(e, r.sp).some(Boolean);
      const last = prevTeam(date, r.sp);
      const prefer = (a, b) => ((last.indexOf(a.id) + 1 || 99) - (last.indexOf(b.id) + 1 || 99)) || (signing.has(a.id) - signing.has(b.id)) || flex(a) - flex(b);
      const others = () => free().filter(e => can(e) && !notMine(e, r) && !(homeOpen(e) && e.headAt !== r.sp)).sort(prefer);
      if (cleaningDay) { // closed: just one person from the usual team, for cleaning
        const cc = sp.closedClean, w0 = toSlot(cc.from), w1 = endSlot(cc.to);
        const fits = e => { const m = empMask(e, r.sp); for (let k = w0; k < w1; k++) if (!m[k]) return false; return restOk(e, w0); };
        const e = [...free().filter(x => x.headAt === r.sp).sort(prefer), ...others()].find(fits);
        if (!e) { notes.push(`Nobody from the ${sp.name} team is available for cleaning today.`); return; }
        const p = bestPlan(e, 50, r.sp, 0); if (p) assignPlan(e, p);
        return;
      }
      // 1) the headwaiter (yesterday's, if in)
      const heads = free().filter(e => e.headAt === r.sp && can(e)).sort(prefer);
      let lead = heads[0];
      if (!lead) { lead = others()[0]; if (lead) notes.push(`No ${sp.name} headwaiter is in, so ${lead.name} runs it.`); }
      if (lead) {
        const T = targetSlots(lead, day);
        if (h.periods.length >= 2 && r.dinner && !oneBlock(lead)) {
          const l0 = toSlot(r.lunch[0]), l1 = endSlot(r.lunch[1]), d0 = toSlot(r.dinner[0]);
          if (!restOk(lead, l0)) notes.push(`${lead.name} starts ${sp.name} at ${r.lunch[0]} without ${R().minRestH}h rest.`);
          const lunchLen = Math.min(l1 - l0, T), dinLen = Math.min(endSlot(r.dinner[1]) - d0, T - lunchLen);
          place(lead, r.sp, l0, l0 + lunchLen, 'split', 'team');
          if (dinLen > 0) place(lead, r.sp, d0, d0 + dinLen, 'split', 'team');
        } else { const p = bestPlan(lead, 50, r.sp); if (p) assignPlan(lead, p); }
      } else notes.push(`Nobody available to run ${sp.name}.`);
      // 2) a second / third person only where bookings need them; nobody beyond that
      capWin[r.sp] = [0, SLOTS];
      const shortNow = () => need[r.sp].some((x, k) => x - cover[r.sp][k] > 0);
      for (let guard = 0; guard < 4 && shortNow(); guard++) {
        let placed = false;
        for (const e of others()) {
          const p = bestPlan(e, 50, r.sp, 0, true); // must include the Munkastova hours
          if (p) { assignPlan(e, p); placed = true; break; }
        }
        if (!placed) break;
      }
    }
  });

  // 1) Other headwaiters: their own place first (topped up elsewhere if it isn't open long enough)
  free().filter(e => homeOpen(e)).forEach(e => { const p = bestPlan(e, 3); if (p) assignPlan(e, p); });

  // 2) Everyone else, biggest gaps first
  while (true) {
    let pick = null;
    for (const e of free()) {
      const p = bestPlan(e, 0);
      if (!p) { used.add(e.id); notes.push(`${e.name} can't be placed: none of their positions are open (or not enough rest).`); continue; }
      const key = [p.tot, p.score, -e.allowed.length];
      if (!pick || key[0] > pick.key[0] || (key[0] === pick.key[0] && (key[1] > pick.key[1] || (key[1] === pick.key[1] && key[2] > pick.key[2])))) pick = {e, p, key};
    }
    if (!pick) break;
    assignPlan(pick.e, pick.p);
  }
  // 3) Last resort: managers/supervisors fill what is still short (again after breaks; see fillWithBackups)
  fillWithBackups(date, day, shifts, cover);
  day.genNotes = notes;
  day.prevSig = shiftSig(addDays(date, -1));
  return shifts;
}

// Managers/supervisors fill whatever is still short, anywhere, in pieces of any length
// (even 30 minutes), up to their daily hours. Supervisors first. Returns how many shifts were added.
function fillWithBackups(date, day, shifts, cover) {
  const sps = cfg().salesPoints;
  const backups = cfg().employees.filter(e => day.working.includes(e.id) && isBackup(e));
  if (!backups.length) return 0;
  const floor = computeNeed(date, day, false);
  const isShort = (sp, k) => floor[sp][k] - cover[sp][k] > 0;
  const order = [...backups].sort((a, b) => (!!b.supervisor - !!a.supervisor) || (!!a.manager - !!b.manager));
  const used = e => shifts.filter(x => x.emp === e.id).reduce((t, x) => t + x.end - x.start, 0);
  const fits = (e, a, b) => {
    const [w0, w1] = signWindow(e, date, day);
    if (a < w0 || b > w1 || a < earliestStart(e, date) || a < 0 || b > SLOTS) return false;
    return !shifts.some(x => x.emp === e.id && x.start < b && x.end > a);
  };
  let added = 0;
  for (let guard = 0; guard < 120; guard++) {
    const runs = [];
    sps.forEach(sp => { let k = 0; while (k < SLOTS) { if (!isShort(sp.id, k)) { k++; continue; } let e = k; while (e < SLOTS && isShort(sp.id, e)) e++; runs.push({sp: sp.id, s: k, e}); k = e; } });
    if (!runs.length) break;
    // mandatory places (e.g. Placeur) first, then the longest gaps
    const must = new Set((cfg().fixedRules || []).filter(r => r.type === 'cover').map(r => r.sp));
    runs.sort((a, b) => (must.has(b.sp) - must.has(a.sp)) || (b.e - b.s) - (a.e - a.s));
    let done = false;
    for (const r of runs) {
      for (const e of order) {
        const left = targetSlots(e, day) - used(e); if (left < 1) continue;
        // the whole gap if they have the hours, otherwise as much of it as they can; any free stretch inside it
        let a = r.s, b = Math.min(r.e, r.s + left);
        while (a < r.e && !fits(e, a, a + 1)) a++;
        if (a >= r.e) continue;
        b = a; while (b < r.e && b - a < left && fits(e, a, b + 1)) b++;
        if (b <= a) continue;
        shifts.push({id: uid(), emp: e.id, sp: r.sp, start: a, end: b, fixed: 'backup'});
        for (let k = a; k < b; k++) cover[r.sp][k]++;
        added++; done = true; break;
      }
      if (done) break;
    }
    if (!done) break;
  }
  // join touching pieces at the same place
  backups.forEach(e => {
    const mine = shifts.filter(x => x.emp === e.id && x.fixed === 'backup').sort((a, b) => a.start - b.start);
    for (let i = 1; i < mine.length; i++) if (mine[i].sp === mine[i - 1].sp && mine[i].start === mine[i - 1].end) { mine[i - 1].end = mine[i].end; shifts.splice(shifts.indexOf(mine[i]), 1); mine.splice(i--, 1); }
  });
  return added;
}

// Everyone on the schedule today, each with all their shifts, grouped under the sales point
// where they work the most hours (ties: the earliest shift).
function peopleByPlace(day) {
  const sps = cfg().salesPoints, byEmp = new Map();
  day.shifts.forEach(s => { if (!byEmp.has(s.emp)) byEmp.set(s.emp, []); byEmp.get(s.emp).push(s); });
  const groups = new Map(sps.map(sp => [sp.id, []]));
  byEmp.forEach((list, empId) => {
    list.sort((a, b) => a.start - b.start);
    const hrs = {}; list.forEach(s => hrs[s.sp] = (hrs[s.sp] || 0) + s.end - s.start);
    const e = empById(empId);
    let main = list[0].sp;
    for (const sp in hrs) if (hrs[sp] > hrs[main]) main = sp;
    if (e && e.headAt && hrs[e.headAt]) main = e.headAt; // headwaiters always sit under their own place
    if (!groups.has(main)) groups.set(main, []);
    groups.get(main).push({empId, e, list, total: list.reduce((a, s) => a + s.end - s.start, 0)});
  });
  groups.forEach(g => g.sort((a, b) => (!!(b.e && b.e.headAt && groups.get(b.e.headAt) === g) - !!(a.e && a.e.headAt && groups.get(a.e.headAt) === g))
    || a.list[0].start - b.list[0].start || a.list[0].end - b.list[0].end));
  return groups;
}
const spShort = sp => sp ? sp.name.split(' ')[0] : '?';

function bookingSummary(sp, day) {
  const bk = day.bookings[sp.id] || {};
  return (sp.bookingTypes || []).filter(t => +bk[t.key] > 0).map(t => `${t.label.toLowerCase()} ${bk[t.key]}`).join(', ');
}
function scheduleText(date, day) {
  const lines = ['Work schedule – ' + fmtDate(date) + (day.pax ? ` (${day.pax} passengers)` : '')], groups = peopleByPlace(day);
  cfg().salesPoints.forEach(sp => {
    const people = groups.get(sp.id) || [], bk = bookingSummary(sp, day);
    if (!people.length && !bk) return;
    lines.push('', sp.name.toUpperCase());
    if (bk) lines.push('  Bookings: ' + bk);
    people.forEach(({empId, e, list, total}) => {
      const parts = list.map(s => `${slotTime(s.start)}–${slotTime(s.end)}${s.sp !== sp.id ? ' ' + spById(s.sp).name : ''}`).join(' + ');
      const br = (day.breaks || []).filter(b => b.emp === empId).sort((x, y) => x.slot - y.slot).map(b => `${b.meal.toLowerCase()} ${slotTime(b.slot)}`).join(', ');
      lines.push(`  ${(e ? e.name : '?') + (e && e.headAt === sp.id ? ' ★' : '')}`.padEnd(16) + `${parts}  (${total / 2}h)${br ? '  [' + br + ']' : ''}`);
    });
  });
  lines.push('', '★ = headwaiter');
  return lines.join('\n');
}

/* ============ Rendering ============ */
let pointerDown = false, renderPending = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const pointerRelease = () => setTimeout(() => { pointerDown = false; if (renderPending) { renderPending = false; render(); } }, 0);
document.addEventListener('pointerup', pointerRelease, true);
document.addEventListener('pointercancel', pointerRelease, true);
function scheduleRender() { if (pointerDown) renderPending = true; else render(); }

// A selector that finds "the same" field again after a redraw.
function focusKey(a) {
  if (!a || a === document.body || !a.matches || !a.matches('input,select,textarea')) return null;
  if (a.id) return '#' + CSS.escape(a.id);
  if (!a.dataset.ch) return null;
  return ['ch', 'id', 'f', 'i', 'd', 'sp', 'k', 'p', 'scope'].filter(k => a.dataset[k] !== undefined)
    .map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('');
}
function render() {
  // keep the field the person is in (and any half-typed text in a plain box) across the redraw
  const a = document.activeElement, key = focusKey(a);
  const typed = key && a.id && a.type !== 'checkbox' ? a.value : null;
  const sel = key && /^(text|search|email|password)$/.test(a.type) ? [a.selectionStart, a.selectionEnd] : null;
  renderInner();
  if (!key) return;
  const el = document.querySelector(key); if (!el) return;
  if (typed !== null) el.value = typed;
  el.focus();
  if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
}
function renderInner() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  ['day','setup','sync'].forEach(v => $('#view-' + v).hidden = v !== view);
  if (view === 'day') renderDay(); else if (view === 'setup') renderSetup(); else renderSync();
  renderBadge();
}

      <div class="periods"><span class="per">Arrival <select data-ch="port" data-f="arr">${timeOptsNone(pc.arr)}</select></span>

// Alerts + timeline: redrawn on their own while bookings are typed, so the buttons never move.
function dayResultsHTML(day) {
  const {salesPoints: sps, employees: emps} = cfg();
  const need = computeNeed(curDate, day, false), cover = computeCover(day);
  const working = new Set(day.working);
  // Alerts
  const alerts = [];
  sps.forEach(sp => {
    const open = need[sp.id].some(x => x > 0);
    const heads = emps.filter(e => e.headAt === sp.id);
    const bk = day.bookings[sp.id] || {}, h = spHours(sp, curDate, day);
    (sp.bookingTypes || []).forEach(t => {
      if (!(+bk[t.key] > 0)) return;
      let any = false; for (let s = toSlot(t.from); s < endSlot(t.to); s++) if (isOpenAt(h, s)) any = true;
      if (!any) alerts.push(['warn', `<b>${esc(sp.name)}</b>: ${bk[t.key]} ${esc(t.label.toLowerCase())} booked, but it's closed ${t.from}–${t.to} today.`]);
    });
    if (open && heads.length && !heads.some(e => working.has(e.id))) alerts.push(['warn', `No headwaiter of <b>${esc(sp.name)}</b> is in today.`]);
    if (day.shifts.length) gapRanges(need[sp.id], cover[sp.id]).forEach(g =>
      alerts.push(['bad', `<b>${esc(sp.name)}</b> is short ${g.max} ${g.max > 1 ? 'people' : 'person'} ${slotTime(g.s)}–${slotTime(g.e)}`]));
  });
  if (day.shifts.length) {
    const idle = emps.filter(e => working.has(e.id) && !isBackup(e) && !day.shifts.some(s => s.emp === e.id));
    const usedB = emps.filter(e => isBackup(e) && day.shifts.some(s => s.emp === e.id));
    if (usedB.length) alerts.push(['info', `Gaps filled by managers/supervisors: ${usedB.map(e => `${esc(e.name)} (${day.shifts.filter(s => s.emp === e.id).sort((a, b) => a.start - b.start).map(s => `${esc(spById(s.sp).name)} ${slotTime(s.start)}–${slotTime(s.end)}`).join(', ')})`).join('; ')}`]);
    if (idle.length) alerts.push(['info', `In today but not on the schedule: ${idle.map(e => esc(e.name)).join(', ')}`]);
    const notIn = [...new Set(day.shifts.filter(s => !working.has(s.emp)).map(s => s.emp))].map(empById).filter(Boolean);
    if (notIn.length) alerts.push(['warn', `On the schedule but not ticked in: ${notIn.map(e => esc(e.name)).join(', ')}`]);
    // Rest between days is always checked live (below), so saved rest messages are dropped.
    const restMsg = /without \d+(\.\d+)?h rest after yesterday/;
    const stale = day.prevSig === undefined ? null : day.prevSig !== shiftSig(addDays(curDate, -1));
    if (stale) alerts.push(['info', `${WDL[wdIndex(addDays(curDate, -1))]}'s schedule has changed since this day was generated. Rest times are checked against the new ${WDL[wdIndex(addDays(curDate, -1))]} schedule; press <b>Generate schedule</b> to redo this day using it.`]);
    (day.genNotes || []).filter(t => !restMsg.test(t) && !(stale && /day.? in a row|team:|rest/.test(t))).forEach(t => alerts.push(['warn', esc(t)]));
    const outside = day.shifts.filter(s => { const e = empById(s.emp); if (!e || !spById(s.sp) || s.fixed) return false;
      const m = empMask(e, s.sp); for (let k = s.start; k < s.end; k++) if (!m[k]) return true; return false; });
    if (outside.length) alerts.push(['warn', `Outside their work positions: ${outside.map(s => `${esc(empById(s.emp).name)} at ${esc(spById(s.sp).name)} ${slotTime(s.start)}–${slotTime(s.end)}`).join(', ')}`]);
    checkRules(curDate, day).forEach(t => alerts.push(['warn', esc(t)]));
  } else {
    alerts.push(['info', day.working.length ? 'Enter the bookings, then press <b>Generate schedule</b>.' : 'Tick who\'s in today, enter the bookings, then press <b>Generate schedule</b>.']);
  }

  return `<div class="alerts">${alerts.map(([k, t]) => `<div class="alert ${k}">${t}</div>`).join('')}</div>
        ${ui.dview === 'timeline' ? timelineHTML(day, need, cover) : gridHTML(day, need, cover)}`;
}

// Spreadsheet-style schedule: one row per person, one column per half hour 05:00–05:00.
function gridHTML(day, need, cover, forPrint) {
  const sps = cfg().salesPoints, emps = cfg().employees, working = new Set(day.working);
  const onSchedule = new Set(day.shifts.map(s => s.emp));
  const people = emps.filter(e => working.has(e.id) || onSchedule.has(e.id));
  if (!people.length) return `<div class="tl-wrap"><div class="empty">Tick who's in today, then press Generate schedule.</div></div>`;
  const brk = new Map(); (day.breaks || []).forEach(b => { for (let k = b.slot; k < b.slot + b.len; k++) brk.set(b.emp + ':' + k, b); });
  let h = `<div class="gwrap"><table class="sgrid${forPrint ? ' print' : ''}"><colgroup><col class="c-name">${'<col class="c-slot">'.repeat(SLOTS)}<col class="c-num"><col class="c-num"></colgroup>
    <thead><tr><th class="corner"></th>`;
  for (let k = 0; k < SLOTS; k++) h += `<th class="slot${slotTime(k).endsWith(':00') ? ' hr' : ''}"><span>${slotTime(k)} - ${slotTime(k + 1) === '00:00' ? '24:00' : slotTime(k + 1)}</span></th>`;
  h += `<th class="num">HOURS</th><th class="num rest">Rest hours</th></tr></thead><tbody>`;
  people.forEach(e => {
    const mine = day.shifts.filter(s => s.emp === e.id);
    const total = workBlocks(day, e.id).reduce((a, b) => a + b.end - b.start, 0) / 2;
    const want = targetSlots(e, day) / 2;
    h += `<tr><th class="name">${esc(e.name)}${e.headAt ? ' <span class="star">★</span>' : ''}${isBackup(e) ? ` <span class="tag mgr">${e.manager ? 'mgr' : 'sup'}</span>` : ''}${(day.signing || []).includes(e.id) ? ` <span class="tag">${(day.signDir || {})[e.id] === 'on' ? 'sign on' : 'sign off'}</span>` : ''}</th>`;
    for (let k = 0; k < SLOTS; k++) {
      const s = mine.find(x => k >= x.start && k < x.end), b = brk.get(e.id + ':' + k), sp = s && spById(s.sp);
      const bg = b ? BREAK_COLOR : sp ? sp.color : '';
      const tip = b ? `${b.meal} break ${slotTime(k)}` : sp ? `${sp.name} ${slotTime(s.start)}–${slotTime(s.end)}` : `${e.name}, ${slotTime(k)}: add a shift`;
      h += `<td class="${slotTime(k).endsWith(':00') ? 'hr' : ''}"${bg ? ` style="background:${bg}"` : ''}${forPrint ? '' : ` data-act="cell" data-emp="${e.id}" data-k="${k}" title="${esc(tip)}"`}></td>`;
    }
    const ok = total === want && total > 0;
    h += `<td class="num ${total ? (ok ? 'ok' : 'off') : ''}">${total ? total.toFixed(2).replace('.', ',') : ''}</td><td class="num rest">${total ? (24 - total).toFixed(2).replace('.', ',') : ''}</td></tr>`;
  });
  h += `</tbody></table>`;
  // legend, like the bottom row of the paper schedule
  const shown = sps.filter(sp => need[sp.id].some(x => x > 0) || day.shifts.some(s => s.sp === sp.id));
  h += `<div class="glegend">${shown.map(sp => `<span><i style="background:${sp.color}"></i>${esc(sp.name)}</span>`).join('')}<span><i style="background:${BREAK_COLOR}"></i>Break</span></div>`;
  if (!forPrint) {
    h += `<details class="gcov"${day.shifts.length ? '' : ' open'}><summary>Staff on / needed per half hour</summary><table class="sgrid cov"><colgroup><col class="c-name">${'<col class="c-slot">'.repeat(SLOTS)}<col class="c-num"><col class="c-num"></colgroup><tbody>`;
    shown.forEach(sp => {
      h += `<tr><th class="name"><i class="dot" style="background:${sp.color}"></i> ${esc(sp.name)}</th>`;
      for (let k = 0; k < SLOTS; k++) {
        const nn = need[sp.id][k], cc = cover[sp.id][k];
        h += `<td class="${cc < nn ? 'short' : nn || cc ? (cc > nn ? 'over' : 'ok') : ''}${slotTime(k).endsWith(':00') ? ' hr' : ''}" title="${esc(sp.name)} ${slotTime(k)}: ${cc} on, ${nn} needed">${nn || cc ? (cc < nn ? cc - nn : cc) : ''}</td>`;
      }
      h += `<td class="num"></td><td class="num"></td></tr>`;
    });
    h += `</tbody></table><p class="help" style="margin:6px 0 0">Numbers = staff on; red = short by that many.</p></details>`;
  }
  return h + `</div>`;
}

function timelineHTML(day, need, cover) {
  const sps = cfg().salesPoints;
  let r0 = SLOTS, r1 = 0;
  sps.forEach(sp => need[sp.id].forEach((n, i) => { if (n > 0) { r0 = Math.min(r0, i); r1 = Math.max(r1, i + 1); } }));
  day.shifts.forEach(s => { r0 = Math.min(r0, s.start); r1 = Math.max(r1, s.end); });
  if (r1 <= r0) return `<div class="tl-wrap"><div class="empty">Every sales point is closed today.</div></div>`;
  const cols = r1 - r0;
  let h = `<div class="tl-wrap"><div class="tl" style="--cols:170px repeat(${cols},minmax(30px,1fr));min-width:${170 + cols * 30}px">`;
  h += `<div class="tl-row tl-head"><div class="tl-lab"></div>`;
  for (let i = r0; i < r1; i++) { const t = slotTime(i); h += `<div class="tl-time ${t.endsWith(':30') ? 'half' : ''}">${t.endsWith(':00') ? t.slice(0, 2) : ''}</div>`; }
  h += `</div>`;
  const groups = peopleByPlace(day), col = (x, y) => `grid-row:1;grid-column:${x - r0 + 2}/${y - r0 + 2}`;
  sps.forEach(sp => {
    const n = need[sp.id], c = cover[sp.id], people = groups.get(sp.id) || [];
    if (!n.some(x => x > 0) && !people.length && !day.shifts.some(s => s.sp === sp.id)) return;
    const hr = spHours(sp, curDate, day);
    h += `<div class="tl-sp"><span class="dot" style="background:${sp.color}"></span><b>${esc(sp.name)}</b>
      <span class="muted">${hoursLabel(hr)}</span>
      <button class="link" data-act="add-shift" data-sp="${sp.id}">+ shift</button></div>`;
    people.forEach(({empId, e, list, total}) => {
      h += `<div class="tl-row"><div class="tl-lab" style="grid-row:1"><span class="nm">${esc(e ? e.name : '(removed)')}${e && e.headAt ? ` <span class="star" title="Headwaiter, ${esc((spById(e.headAt) || {}).name || '')}">★</span>` : ''}</span><span class="hrs">${total / 2}h</span></div>`;
      list.forEach(s => {
        const p = spById(s.sp), other = s.sp !== sp.id, w = s.end - s.start;
        const brk = (day.breaks || []).filter(b => b.emp === empId && b.slot >= s.start && b.slot < s.end);
        const tip = `${p ? p.name : '?'} ${slotTime(s.start)}–${slotTime(s.end)} (${w / 2}h)${s.fixed ? ', fixed rule' : ''}${brk.map(b => `, ${b.meal.toLowerCase()} break ${slotTime(b.slot)}`).join('')}. Click to edit.`;
        h += `<div class="tl-bar${other ? ' other' : ''}" style="${col(s.start, s.end)};--c:${p ? p.color : '#888'}" data-act="edit-shift" data-id="${s.id}" title="${esc(tip)}" data-ink="${inkOn(p ? p.color : '')}">${other && w >= 4 ? `<b>${esc(spShort(p))}</b> ` : ''}${w >= 4 ? `${slotTime(s.start)}–${slotTime(s.end)}` : slotTime(s.start)}</div>`;
        brk.forEach(b => h += `<div class="tl-brk" style="${col(b.slot, b.slot + b.len)}" title="${esc(b.meal)} break ${slotTime(b.slot)}–${slotTime(b.slot + b.len)}"></div>`);
      });
      h += `</div>`;
    });
    h += `<div class="tl-row tl-cov"><div class="tl-lab muted" style="font-size:11px">staff on / needed</div>`;
    for (let i = r0; i < r1; i++) {
      const nn = n[i], cc = c[i];
      const cls = cc < nn ? 'short' : (nn === 0 && cc === 0 ? '' : (cc > nn ? 'over' : 'ok'));
      h += `<div class="cov ${cls}">${nn || cc ? cc + '/' + nn : ''}</div>`;
    }
    h += `</div>`;
  });
  return h + `</div></div>`;
}

function periodsEditor(h, attrs) {
  return `<div class="periods">${h.periods.map((p, i) => `<div class="per">
      <select data-ch="per" data-i="${i}" data-f="open" ${attrs}>${timeOpts(p.open)}</select>–<select data-ch="per" data-i="${i}" data-f="close" ${attrs}>${endOpts(p.close)}</select>
      <button class="x" data-act="per-del" data-i="${i}" ${attrs} title="Remove this period">✕</button></div>`).join('') || '<span class="muted per">closed</span>'}
    <button class="link" data-act="per-add" ${attrs}>+ period</button></div>`;
}
// Which hours an editor control belongs to: a sales point's standard week, or one day's override.
function hoursTarget(el) {
  const sp = spById(el.dataset.id);
  if (el.dataset.scope === 'day') {
    const day = getDay(curDate), h = spHours(sp, curDate, day);
    return {h, commit: () => { day.hours[sp.id] = h; saveDay(curDate); scheduleRender(); }};
  }
  const d = el.dataset.d, h = normHours(sp.hours[d]);
  return {h, commit: () => { sp.hours[d] = h; saveConfig(); scheduleRender(); }};
}
