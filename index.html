<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Scheduler</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#15181d;--muted:#667085;--line:#e3e6eb;--accent:#1d4ed8;--accent-ink:#fff;--bad:#c81e1e;--bad-bg:#fde8e8;--ok-bg:#e9f7ef;--over-bg:#eef2ff;--warn:#a15c07;--warn-bg:#fff4e0;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--ink:#e8eaed;--muted:#98a2b3;--line:#2a2f37;--accent:#60a5fa;--accent-ink:#0b1220;--bad:#f87171;--bad-bg:#3a1616;--ok-bg:#13261b;--over-bg:#1c2240;--warn:#fbbf24;--warn-bg:#2d2310;--chip:#242932}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.big{padding:9px 16px;font-weight:600}
button.danger{color:var(--bad)}
button.link{background:none;border:none;padding:2px 4px;color:var(--accent)}
button.x{background:none;border:none;padding:0 4px;color:var(--muted)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
input[type=checkbox]{padding:0}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:4px}
nav button{background:none;border-color:transparent}
nav button.active{background:var(--chip);border-color:var(--line);font-weight:600}
.badge{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.badge.online{background:var(--ok-bg);color:inherit}
.badge.error,.badge.signin{background:var(--warn-bg);color:var(--warn)}
main{padding:16px;max-width:1500px;margin:0 auto}
.muted{color:var(--muted);font-weight:400}
.spacer{flex:1}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.datebar .wd{font-size:18px;font-weight:600;margin-left:6px}
.day-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:950px){.day-grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h3 .acts{margin-left:auto;display:flex;gap:4px}
.card h3 .acts button{padding:3px 8px;font-size:12px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:99px;padding:5px 11px;background:var(--panel)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{opacity:.8}
.hrow{display:flex;align-items:center;gap:6px;padding:4px 0;flex-wrap:wrap}
.hrow{flex-wrap:nowrap}
.sailing{padding:2px 0 6px 16px;font-size:13px}
.sailing .muted{font-size:11.5px}
tr.cur td{background:var(--ok-bg)}
.paxrow{margin:0 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.paxrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.paxrow input{width:110px;font-size:15px}
.paxrow .muted{font-size:12px;margin-top:4px}
.bookrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-left:16px}
.book{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.book input{width:100%;font-size:15px;color:var(--ink)}
.hblock{padding:4px 0;border-bottom:1px dashed var(--line)}
.hblock:last-child{border-bottom:none}
.periods{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-left:16px}
.per{display:flex;align-items:center;gap:3px}
.per select{padding:3px 2px;font-size:13px}
.hrow select{padding:3px 2px;font-size:13px}
.hname{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.addrow input:not([type=number]){flex:1;min-width:90px}
.grp{margin-top:8px}
.grp-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:2px}
.li{display:flex;align-items:center;gap:8px;padding:3px 0 3px 16px;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:none}
.li .warn{color:var(--warn);font-size:12px}
.li .x{margin-left:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.alerts{margin-bottom:10px;display:flex;flex-direction:column;gap:5px}
.alert{padding:7px 11px;border-radius:8px;font-size:13px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--chip)}
.tl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tl-row{display:grid;grid-template-columns:var(--cols);align-items:center;min-height:30px}
.tl-head{position:sticky;top:0;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.tl-time{border-left:1px solid var(--line);padding-left:3px;height:20px}
.tl-time.half{border-left-style:dotted}
.tl-lab{padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tl-sp{display:flex;align-items:center;gap:8px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.tl-sp:first-of-type{border-top:none}
.tl-bar{height:24px;border-radius:6px;background:var(--c);color:#fff;font-size:12px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tl-bar b{font-weight:700}
.tl-bar[data-ink="#1a1a1a"]{color:#1a1a1a}
.tl-lab{display:flex;align-items:center;gap:6px}
.tl-lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab .hrs{margin-left:auto;font-size:11px;color:var(--muted);padding-right:4px}
.tl-lab .star{color:#d97706}
.tl-row:not(.tl-head):not(.tl-cov):hover{background:var(--chip)}
.tl-bar span{opacity:.85}
.tl-brk{height:24px;z-index:2;pointer-events:none;position:relative}
.tl-brk::after{content:'';position:absolute;left:2px;right:2px;bottom:2px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 4px,rgba(255,255,255,.4) 4px 7px)}
.tl-bar{position:relative}
.signrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px}
.chip.small{padding:2px 9px;font-size:12px}
.tl-cov{min-height:24px}
.cov{font-size:10.5px;text-align:center;height:22px;line-height:22px;border-left:1px solid var(--panel)}
.cov.short{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cov.ok{background:var(--ok-bg)}
.cov.over{background:var(--over-bg)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
@media (max-width:500px){.setup-grid{grid-template-columns:1fr}}
.sp-top{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.sp-top input[type=text]{flex:1;font-weight:600}
.sp-top input[type=color]{width:34px;height:30px;padding:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px}
.fields label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.fields input{width:70px}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px}
.allowed{display:flex;flex-wrap:wrap;gap:4px 10px}
.pgrp{display:inline-flex;gap:8px;align-items:center;padding:2px 8px;border:1px solid var(--line);border-radius:7px}
.pgrp b{font-size:12px;font-weight:600}
.pgrp.backup{background:var(--chip)}
.allowed label{font-size:12px;display:flex;gap:3px;align-items:center;white-space:nowrap}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
pre.code{background:var(--chip);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px}
dialog label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-bottom:10px}
dialog .row{display:flex;gap:10px}
dialog .row label{flex:1}
.dlg-actions{display:flex;gap:8px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--panel)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.gwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.sgrid{border-collapse:collapse;table-layout:fixed;width:max-content;font-size:12px;color:#1a1a1a}
.sgrid col.c-name{width:120px}.sgrid col.c-slot{width:20px}.sgrid col.c-num{width:66px}
.sgrid td,.sgrid th{border:1px solid #9a9a9a;padding:0;height:22px;background:#fff}
.sgrid td.hr,.sgrid th.hr{border-left-color:#555}
.sgrid thead th{background:#a6a6a6;color:#1a1a1a;font-weight:700}
.sgrid thead th.slot{height:92px;vertical-align:bottom}
.sgrid thead th.slot span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;font-size:10.5px;padding:4px 0;white-space:nowrap}
.sgrid thead th.num{font-size:12px;line-height:1.1}
.sgrid thead th.corner{background:#d9d9d9}
.sgrid th.name{text-align:left;font-weight:400;color:#1a1a1a;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:1}
.sgrid .star{color:#c55a11}.sgrid .tag.mgr{background:#d9d9d9}.sgrid .tag{font-size:10px;background:#ffe699;border-radius:3px;padding:0 3px}
.sgrid td[data-act]{cursor:pointer}
.sgrid td[data-act]:hover{outline:2px solid #1a1a1a;outline-offset:-2px}
.sgrid td.num{text-align:center;font-weight:700}
.sgrid td.num.ok{background:#00B050;color:#fff}
.sgrid td.num.off{background:#FFFF00}
.sgrid td.num.rest{background:#fff}
.sgrid.cov td{font-size:10px;text-align:center;color:#555}
.sgrid.cov td.short{background:#fde8e8;color:#c81e1e;font-weight:700}
.sgrid.cov td.ok{background:#e9f7ef}
.sgrid.cov td.over{background:#eef2ff}
.sgrid .dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 2px;font-size:12px;color:var(--ink)}
.glegend span{display:flex;align-items:center;gap:6px;font-weight:600}
.glegend i{display:inline-block;width:42px;height:14px;border:1px solid #9a9a9a}
.glegend .brush{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:4px 8px;border-radius:8px;border:2px solid transparent;background:none}
.glegend .brush:hover{background:var(--chip)}
.glegend .brush.on{border-color:var(--ink);background:var(--chip)}
.glegend .legend-only{color:var(--muted)}
.glegend i.eraser{background:repeating-linear-gradient(135deg,#fff 0 4px,#d0d0d0 4px 8px)}
.paint-help{margin:4px 2px 0;font-size:12px}
.sgrid.painting td[data-emp]{cursor:crosshair}
.sgrid{user-select:none;-webkit-user-select:none;touch-action:pan-y}
.gcov{margin-top:10px}.gcov summary{cursor:pointer;font-size:13px;color:var(--muted)}
.gcov .sgrid{margin-top:6px}
#printArea{display:none}
.paxrow label.ptext{display:grid;grid-template-columns:1fr;gap:3px;align-items:start;margin-top:10px;font-size:13px;font-weight:600}
.paxrow label.ptext .muted{display:inline;margin:0 0 0 4px;font-weight:400}
.paxrow .ptext input,.paxrow .ptext textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;font-weight:400;color:var(--ink)}
.sgrid th.sign-off{color:#c00000}.sgrid th.sign-on{color:#00a040}
.sgrid col.c-sig{width:90px}.sgrid th.sig{font-size:11px;line-height:1.1;background:#fff}
.ph,.poh,.pbk{border-collapse:collapse;font-size:11px;color:#000}
.ph{width:100%;margin-bottom:3px;table-layout:fixed}
.ph th{background:#d9d9d9;border:1px solid #777;padding:1px 4px;font-size:12px}
.ph td{border:1px solid #777;padding:1px 4px;text-align:center;font-size:11px}
.ph td.big{font-weight:700;font-size:13px}
.ph td.ph-warn{color:#c00000;font-weight:700;font-size:13px;width:38%;border:none}
.ph small{font-size:9px;margin-left:4px}
.pb{display:flex;gap:6px;margin-top:4px;align-items:flex-start;color:#000}
.poh th,.poh td,.pbk th,.pbk td{border:1px solid #777;padding:1px 5px;height:16px}
.poh th,.pbk th{background:#bdd7ee;text-align:center}
.poh tr th:first-child{text-align:left;min-width:110px}
.poh td{text-align:center;font-weight:700}.poh tr.meal th{padding-left:16px;font-weight:600}.poh tr.meal td{font-weight:400}.poh td.closed{font-weight:400;color:#777}
.pbk td.sw{width:10px;padding:0}.pbk td.n{text-align:right;min-width:30px;font-weight:700}
.poh{width:38%}.pbk{width:20%}
.pobs{flex:1;display:flex;flex-direction:column;border:1px solid #777;font-size:11px;min-height:120px}
.pobs-h{background:#bdd7ee;text-align:center;font-weight:700;border-bottom:1px solid #777}
.pobs-b{flex:1;padding:3px 6px}
.pph{border-collapse:collapse;width:9%;font-size:10.5px}
.pph th,.pph td{border:1px solid #777;text-align:center;padding:0 3px;height:13px;line-height:1.15;font-style:italic;font-weight:700}
.pph th{font-size:10.5px}.pph td{font-style:normal}
.pnote{text-align:center;color:#c00000;font-weight:700;padding:2px;border-top:1px solid #777}.pnote.y{background:#ffc000}
.ph th,.poh th,.pbk td.sw,.pnote,.pobs-h{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  @page{size:A4 landscape;margin:6mm}
  body{background:#fff;color:#000}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea pre{font-size:13px}
  #printArea .gwrap{border:none;padding:0;overflow:visible}
  #printArea .sgrid{width:100%}
  #printArea .sgrid col.c-name{width:8%}#printArea .sgrid col.c-slot{width:1.6%}#printArea .sgrid col.c-num{width:4%}#printArea .sgrid col.c-sig{width:7.2%}
  #printArea .sgrid td.num{font-size:10px}
  #printArea .sgrid td,#printArea .sgrid th{height:15px;font-size:10.5px}
  #printArea .sgrid thead th.slot{height:62px}#printArea .sgrid thead th.slot span{font-size:7.5px}
  #printArea .glegend{margin-top:3px;font-size:10px}
  .sgrid td,.sgrid th,.glegend i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tl-wrap{border:none;overflow:visible}
  .tl-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cov{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1>Staff Scheduler</h1>
  <nav>
    <button data-act="view" data-v="day">Day</button>
    <button data-act="view" data-v="setup">Setup</button>
    <button data-act="view" data-v="sync">Sync &amp; backup</button>
  </nav>
  <span id="badge" class="badge">Local only</span>
</header>
<main>
  <section id="view-day"></section>
  <section id="view-setup" hidden></section>
  <section id="view-sync" hidden></section>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle">Shift</h3>
    <label>Employee <select name="emp"></select></label>
    <label>Sales point <select name="sp"></select></label>
    <div class="row">
      <label>Start <select name="start"></select></label>
      <label>End <select name="end"></select></label>
    </div>
    <div class="dlg-actions">
      <button type="button" id="dlgDel" class="danger">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="dlgCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="printArea"></div>

<script>
/* ============ Basics ============ */
const SLOTS = 48;          // 30-minute slots in a scheduling day
const DAY0 = 5 * 60;       // the scheduling day runs 05:00 -> 05:00 next morning
const WD = ['mon','tue','wed','thu','fri','sat','sun'];
const WDL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const LS = 'staffsched.state.v1', LSFB = 'staffsched.firebase.v1';
const COLORS = ['#9DC3E6','#00B050','#7030A0','#FFFF00','#0070C0','#00B0F0','#C55A11','#808080'];
// Colours from the paper schedule
const SHEET_COLORS = {laterna: '#9DC3E6', undirhusid: '#00B050', munkastova: '#7030A0', noatun: '#FFFF00', skansagardur: '#0070C0', placeur: '#00B0F0'};
const BREAK_COLOR = '#FF66CC';
// Dark or white text, whichever reads better on a colour
function inkOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff';
  const n = parseInt(m[1], 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1a1a1a' : '#fff';
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));

const toSlot = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return Math.floor((((h*60 + m) - DAY0 + 1440) % 1440) / 30); };
const endSlot = t => { const s = toSlot(t); return s === 0 ? SLOTS : s; };
const slotTime = i => { const m = (DAY0 + i*30) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m % 60); };
const timeOpts = sel => { let o = ''; for (let i = 0; i < SLOTS; i++) { const t = slotTime(i); o += `<option${t===sel?' selected':''}>${t}</option>`; } return o; };
const endOpts = sel => { let o = ''; for (let i = 1; i <= SLOTS; i++) { const t = slotTime(i); o += `<option${t===sel?' selected':''}>${t}</option>`; } return o; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const wdIndex = ds => (new Date(ds + 'T12:00:00').getDay() + 6) % 7;
const fmtDate = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

/* ============ Opening hours ============ */
// A day's hours = list of opening periods; no periods = closed.
const P = (...pairs) => ({periods: pairs.map(([open, close]) => ({open, close}))});
const CLOSED = () => ({periods: []});
function normHours(h) {
  if (!h) return CLOSED();
  if (Array.isArray(h.periods)) return {periods: h.periods.map(p => ({open: p.open, close: p.close}))};
  return h.closed ? CLOSED() : P([h.open || '12:00', h.close || '22:00']); // old single-period format
}
const hoursLabel = h => h.periods.length ? h.periods.map(p => p.open + '–' + p.close).join(', ') : 'closed';
const isOpenAt = (h, s) => h.periods.some(p => s >= toSlot(p.open) && s < endSlot(p.close));
function defWeek(open, close) { const h = {}; WD.forEach(d => h[d] = P([open, close])); return h; }

// M/F Norröna shoulder season (15.03–30.05.2026 & 05.09–22.11.2026), ship time.
// "?" closing times on the sheet are entered as LATE.
const LATE = '02:30';

function getDay(date) {
  if (!state.days[date]) state.days[date] = {working: [], bookings: {}, hours: {}, shifts: []};

  d.working ||= []; d.signing ||= []; d.signDir ||= {}; d.bookings ||= {}; d.hours ||= {}; d.shifts ||= []; d.breaks ||= [];
  // shifts saved when the day started at 06:00 are moved to the 05:00 grid

}

/* ============ Demand: staff needed per 30-min slot ============ */
// planning=true: the generator's target (one extra during staff meals so breaks can be taken).
// planning=false: what must actually be on the floor (used for warnings and the staff on/needed numbers).
// Buffet lunch window (from opening minus "arrive before" to closing plus "stay after"), or null.
function lunchWindow(sp, date, day) {
  if (!sp || !sp.lunchPrep) return null;
  const p = spHours(sp, date, day).periods.find(p => toSlot(p.open) >= toSlot('11:00') && toSlot(p.open) < toSlot('15:00'));
  if (!p) return null;
  return [Math.max(0, toSlot(p.open) - Math.ceil((+sp.lunchPrep.before || 0) / 30)), Math.min(SLOTS, endSlot(p.close) + Math.ceil((+sp.lunchPrep.after || 0) / 30))];
}
// Half hours at a place where nobody may be added beyond what's needed: the buffet lunch window,
// and the hour before opening at places where only the opener comes in early.
function hardCaps(sp, date, day) {
  const cap = new Array(SLOTS).fill(false), w = lunchWindow(sp, date, day);
  if (w) for (let k = w[0]; k < w[1]; k++) cap[k] = true;
  if (+sp.lateMax > 0) for (let k = toSlot('00:00'); k < SLOTS; k++) cap[k] = true; // nobody extra after midnight
  if (+sp.prepStaff > 0) {
    const h = spHours(sp, date, day), pre = Math.ceil((+sp.prepMin || 0) / 30);
    h.periods.forEach(p => { const o = toSlot(p.open); for (let k = Math.max(0, o - pre); k < o; k++) if (!isOpenAt(h, k)) cap[k] = 'prep'; });
  }
  return cap;
}

      for (const [level, check] of [[+P.munkSecond, false], [+P.munkThird, true]]) {
        lvl = level;
        for (let guard = 0; guard < 4 && shortNow(); guard++) {
          const sl = lunchP && shortIn(toSlot(lunchP.open), endSlot(lunchP.close) + 2);
          const sd = dinnerP && shortIn(toSlot(dinnerP.open) - 1, endSlot(dinnerP.close) + 2);
          if (!sl && !sd) break;
          const D0 = dinnerP ? toSlot(dinnerP.open) - 1 : 0, D1 = dinnerP ? Math.min(SLOTS, endSlot(dinnerP.close) + 4) : 0;
          const tm = free().filter(e => e.team === r.sp && can(e) && !oneBlock(e) && !notMine(e, r) && (!check || spare(e))).sort(prefer)
            .find(e => restOk(e, sl ? L0 : D0));

          const T = targetSlots(tm, day);

          let placed = false;

          const sd = dinnerP && shortIn(toSlot(dinnerP.open) - 1, endSlot(dinnerP.close) + 2);
          if (sl && sd && r.dinner) {
            const d0 = toSlot(r.dinner[0]);
            const both = others().filter(e => (!check || spare(e)) && !oneBlock(e) && restOk(e, L0)).find(e => {
              const T = targetSlots(e, day), m = empMask(e, r.sp), d1 = Math.min(SLOTS, d0 + T - (L1 - L0));

              for (let k = d0; k < d1; k++) if (!m[k]) return false;

            });

          }

  // 2) Everyone else, biggest gaps first

    let pick = null;
    for (const e of free()) {
      const p = bestPlan(e, 0);
      if (!p) { used.add(e.id); notes.push(`${e.name} can't be placed: none of their positions are open (or not enough rest).`); continue; }
      const key = [p.tot, p.score, -e.allowed.length];

          const mg = []; iv.forEach(([p, q]) => { const l = mg[mg.length - 1]; if (l && p <= l[1]) l[1] = Math.max(l[1], q); else mg.push([p, q]); });
          if (mg.length > 2 || mg.some((x, i) => i && x[0] - mg[i - 1][1] < minGap)) continue;

    if (t && t < targetSlots(e, day)) notes.push(`${e.name} only gets ${t / 2}h: not enough open hours in their positions.`); });
  // 3) Last resort: managers/supervisors fill what is still short (again after breaks; see fillWithBackups)
  fillWithBackups(date, day, shifts, cover);
  mergePieces(shifts);
  day.genNotes = notes;
  day.prevSig = shiftSig(addDays(date, -1));
  return shifts;
}

// Join touching pieces of the same person at the same place (same kind of shift) into one.
function mergePieces(shifts) {
  const list = [...shifts].sort((a, b) => a.emp.localeCompare(b.emp) || a.start - b.start);

// Managers/supervisors fill whatever is still short, anywhere, in pieces of any length
// (even 30 minutes), up to their daily hours. Supervisors first. Returns how many shifts were added.
function fillWithBackups(date, day, shifts, cover) {
  const sps = cfg().salesPoints;
  const backups = cfg().employees.filter(e => day.working.includes(e.id) && isBackup(e));
  if (!backups.length) return 0;
  const floor = computeNeed(date, day, false);
  const caps = {}; sps.forEach(sp => caps[sp.id] = hardCaps(sp, date, day));
  const tiers = tierNeeds(date, day, floor);
  // before opening only the opener comes in, so backups never fill those slots
  const isShort = (sp, k) => caps[sp][k] !== 'prep' && floor[sp][k] - cover[sp][k] > 0;
  const order = [...backups].sort((a, b) => (!!b.supervisor - !!a.supervisor) || (!!a.manager - !!b.manager));
  const used = e => shifts.filter(x => x.emp === e.id).reduce((t, x) => t + x.end - x.start, 0);
  const fits = (e, a, b) => {
    const [w0, w1] = signWindow(e, date, day);
    if (a < w0 || b > w1 || a < earliestStart(e, date) || a < 0 || b > SLOTS) return false;
    return !shifts.some(x => x.emp === e.id && x.start < b && x.end > a);
  };

    const runs = [];
    sps.forEach(sp => { let k = 0; while (k < SLOTS) { if (!isShort(sp.id, k)) { k++; continue; } let e = k; while (e < SLOTS && isShort(sp.id, e)) e++; runs.push({sp: sp.id, s: k, e, empty: cover[sp.id].slice(k, e).some(v => v === 0),
      tier: Math.min(...Array.from({length: e - k}, (_, i) => tierOf(tiers, sp.id, k + i, cover[sp.id][k + i]) || 9))}); k = e; } });
    if (!runs.length) break;
    // an outlet with nobody at all comes first, then mandatory places (e.g. Placeur), then the longest gaps
    const must = new Set((cfg().fixedRules || []).filter(r => r.type === 'cover').map(r => r.sp));
    runs.sort((a, b) => (b.empty - a.empty) || (must.has(b.sp) - must.has(a.sp)) || a.tier - b.tier || (b.e - b.s) - (a.e - a.s));

        for (let k = a; k < b; k++) cover[r.sp][k]++;
        added++; done = true; break;
      }
      if (done) break;
    }
    if (!done) {

      for (const r of runs.filter(x => x.empty)) {
        let k = r.s; while (k < r.e && cover[r.sp][k] !== 0) k++; if (k >= r.e) continue;
        for (const e of order) {
          const cand = shifts.filter(x => x.emp === e.id && x.fixed === 'backup' && x.end - x.start > 1).flatMap(x => [[x, x.start], [x, x.end - 1]])
            .filter(([x, j]) => cover[x.sp][j] - 1 >= 1); // the place they leave still has someone
          const pick = cand.find(([x, j]) => { if (j === x.start) x.start++; else x.end--; const f = fits(e, k, k + 1); if (j === x.start - 1) x.start--; else x.end++; return f; });

          shifts.push({id: uid(), emp: e.id, sp: r.sp, start: k, end: k + 1, fixed: 'backup'}); cover[r.sp][k]++;

  backups.forEach(e => {
    const mine = shifts.filter(x => x.emp === e.id && x.fixed === 'backup').sort((a, b) => a.start - b.start);
    for (let i = 1; i < mine.length; i++) if (mine[i].sp === mine[i - 1].sp && mine[i].start === mine[i - 1].end) { mine[i - 1].end = mine[i].end; shifts.splice(shifts.indexOf(mine[i]), 1); mine.splice(i--, 1); }
  });
  return added;
}

// Everyone on the schedule today, each with all their shifts, grouped under the sales point
// where they work the most hours (ties: the earliest shift).
function peopleByPlace(day) {

  day.shifts.forEach(s => { if (!byEmp.has(s.emp)) byEmp.set(s.emp, []); byEmp.get(s.emp).push(s); });
  const groups = new Map(sps.map(sp => [sp.id, []]));
  byEmp.forEach((list, empId) => {
    list.sort((a, b) => a.start - b.start);
    const hrs = {}; list.forEach(s => hrs[s.sp] = (hrs[s.sp] || 0) + s.end - s.start);
    const e = empById(empId);
    let main = list[0].sp;
    for (const sp in hrs) if (hrs[sp] > hrs[main]) main = sp;
    if (e && e.headAt && hrs[e.headAt]) main = e.headAt; // headwaiters always sit under their own place
    if (!groups.has(main)) groups.set(main, []);
    groups.get(main).push({empId, e, list, total: list.reduce((a, s) => a + s.end - s.start, 0)});
  });
  groups.forEach(g => g.sort((a, b) => (!!(b.e && b.e.headAt && groups.get(b.e.headAt) === g) - !!(a.e && a.e.headAt && groups.get(a.e.headAt) === g))
    || a.list[0].start - b.list[0].start || a.list[0].end - b.list[0].end));

}
const spShort = sp => sp ? sp.name.split(' ')[0] : '?';

function bookingSummary(sp, day) {
  const bk = day.bookings[sp.id] || {};

}
function scheduleText(date, day) {
  const lines = ['Work schedule – ' + fmtDate(date) + (day.pax ? ` (${day.pax} passengers)` : '')], groups = peopleByPlace(day);
  cfg().salesPoints.forEach(sp => {
    const people = groups.get(sp.id) || [], bk = bookingSummary(sp, day);
    if (!people.length && !bk) return;
    lines.push('', sp.name.toUpperCase());
    if (bk) lines.push('  Bookings: ' + bk);
    people.forEach(({empId, e, list, total}) => {
      const parts = list.map(s => `${slotTime(s.start)}–${slotTime(s.end)}${s.sp !== sp.id ? ' ' + spById(s.sp).name : ''}`).join(' + ');
      const br = (day.breaks || []).filter(b => b.emp === empId).sort((x, y) => x.slot - y.slot).map(b => `${b.meal.toLowerCase()} ${slotTime(b.slot)}`).join(', ');
      lines.push(`  ${(e ? e.name : '?') + (e && e.headAt === sp.id ? ' ★' : '')}`.padEnd(16) + `${parts}  (${total / 2}h)${br ? '  [' + br + ']' : ''}`);
    });
  });
  lines.push('', '★ = headwaiter');
  return lines.join('\n');
}

/* ============ Rendering ============ */
let pointerDown = false, renderPending = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const pointerRelease = () => setTimeout(() => { pointerDown = false; if (renderPending) { renderPending = false; render(); } }, 0);
document.addEventListener('pointerup', pointerRelease, true);
document.addEventListener('pointercancel', pointerRelease, true);
function scheduleRender() { if (pointerDown) renderPending = true; else render(); }

// A selector that finds "the same" field again after a redraw.
function focusKey(a) {
  if (!a || a === document.body || !a.matches || !a.matches('input,select,textarea')) return null;
  if (a.id) return '#' + CSS.escape(a.id);
  if (!a.dataset.ch) return null;
  return ['ch', 'id', 'f', 'i', 'd', 'sp', 'k', 'p', 'scope'].filter(k => a.dataset[k] !== undefined)
    .map(k => `[data-${k}="${CSS.escape(a.dataset[k])}"]`).join('');
}
function render() {
  // keep the field the person is in (and any half-typed text in a plain box) across the redraw
  const a = document.activeElement, key = focusKey(a);
  const typed = key && a.id && a.type !== 'checkbox' ? a.value : null;
  const sel = key && /^(text|search|email|password)$/.test(a.type) ? [a.selectionStart, a.selectionEnd] : null;
  renderInner();
  if (!key) return;
  const el = document.querySelector(key); if (!el) return;
  if (typed !== null) el.value = typed;
  el.focus();
  if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
}
function renderInner() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  ['day','setup','sync'].forEach(v => $('#view-' + v).hidden = v !== view);
  if (view === 'day') renderDay(); else if (view === 'setup') renderSetup(); else renderSync();
  renderBadge();
}

    ${(() => { const pc = portFor(curDate, day); return `<div class="hblock"><div class="hrow"><span class="dot" style="background:#444"></span><span class="hname">Port call <span class="muted">(ship time)</span></span>
      ${day.port ? `<span class="mini">changed today</span><button class="link" data-act="port-reset">reset</button>` : ''}</div>
      ${pc.source === 'sailing' ? `<div class="sailing">${pc.calls.length ? pc.calls.map(c => `<b>${esc(c[0])}</b> ${c[1] ? 'arr ' + c[1] : ''}${c[1] && c[2] ? ' – ' : ''}${c[2] ? 'dep ' + c[2] : ''}`).join('<br>') : esc(pc.label || 'at sea')}${pc.note ? `<div class="muted">${esc(pc.note)}</div>` : ''}<div class="muted">from the sailing schedule</div></div>` : ''}
      <div class="periods"><span class="per">Arrival <select data-ch="port" data-f="arr">${timeOptsNone(pc.arr)}</select></span>

// Alerts + timeline: redrawn on their own while bookings are typed, so the buttons never move.
function dayResultsHTML(day) {
  const {salesPoints: sps, employees: emps} = cfg();
  const need = computeNeed(curDate, day, false), cover = computeCover(day);
  const working = new Set(day.working);
  // Alerts
  const alerts = [];
  sps.forEach(sp => {
    const open = need[sp.id].some(x => x > 0);
    const heads = emps.filter(e => e.headAt === sp.id);
    const bk = day.bookings[sp.id] || {}, h = spHours(sp, curDate, day);
    (sp.bookingTypes || []).forEach(t => {
      if (!(+bk[t.key] > 0)) return;
      let any = false; for (let s = toSlot(t.from); s < endSlot(t.to); s++) if (isOpenAt(h, s)) any = true;
      if (!any) alerts.push(['warn', `<b>${esc(sp.name)}</b>: ${bk[t.key]} ${esc(t.label.toLowerCase())} booked, but it's closed ${t.from}–${t.to} today.`]);
    });
    if (open && heads.length && !heads.some(e => working.has(e.id))) alerts.push(['warn', `No headwaiter of <b>${esc(sp.name)}</b> is in today.`]);
    if (day.shifts.length) gapRanges(need[sp.id], cover[sp.id]).forEach(g =>
      alerts.push(['bad', `<b>${esc(sp.name)}</b> is short ${g.max} ${g.max > 1 ? 'people' : 'person'} ${slotTime(g.s)}–${slotTime(g.e)}`]));
  });
  if (day.shifts.length) {
    const idle = emps.filter(e => working.has(e.id) && !isBackup(e) && !day.shifts.some(s => s.emp === e.id));
    const usedB = emps.filter(e => isBackup(e) && day.shifts.some(s => s.emp === e.id));
    if (usedB.length) alerts.push(['info', `Gaps filled by managers/supervisors: ${usedB.map(e => `${esc(e.name)} (${day.shifts.filter(s => s.emp === e.id).sort((a, b) => a.start - b.start).map(s => `${esc(spById(s.sp).name)} ${slotTime(s.start)}–${slotTime(s.end)}`).join(', ')})`).join('; ')}`]);
    if (idle.length) alerts.push(['info', `In today but not on the schedule: ${idle.map(e => esc(e.name)).join(', ')}`]);
    const notIn = [...new Set(day.shifts.filter(s => !working.has(s.emp)).map(s => s.emp))].map(empById).filter(Boolean);
    if (notIn.length) alerts.push(['warn', `On the schedule but not ticked in: ${notIn.map(e => esc(e.name)).join(', ')}`]);
    // Rest between days is always checked live (below), so saved rest messages are dropped.
    const restMsg = /without \d+(\.\d+)?h rest after yesterday/;
    const stale = day.prevSig === undefined ? null : day.prevSig !== shiftSig(addDays(curDate, -1));
    if (stale) alerts.push(['info', `${WDL[wdIndex(addDays(curDate, -1))]}'s schedule has changed since this day was generated. Rest times are checked against the new ${WDL[wdIndex(addDays(curDate, -1))]} schedule; press <b>Generate schedule</b> to redo this day using it.`]);
    (day.genNotes || []).filter(t => !restMsg.test(t) && !(stale && /day.? in a row|team:|rest/.test(t))).forEach(t => alerts.push(['warn', esc(t)]));
    const outside = day.shifts.filter(s => { const e = empById(s.emp); if (!e || !spById(s.sp) || s.fixed) return false;
      const m = empMask(e, s.sp); for (let k = s.start; k < s.end; k++) if (!m[k]) return true; return false; });
    if (outside.length) alerts.push(['warn', `Outside their work positions: ${outside.map(s => `${esc(empById(s.emp).name)} at ${esc(spById(s.sp).name)} ${slotTime(s.start)}–${slotTime(s.end)}`).join(', ')}`]);
    checkRules(curDate, day).forEach(t => alerts.push(['warn', esc(t)]));
  } else {
    alerts.push(['info', day.working.length ? 'Enter the bookings, then press <b>Generate schedule</b>.' : 'Tick who\'s in today, enter the bookings, then press <b>Generate schedule</b>.']);
  }

  return `<div class="alerts">${alerts.map(([k, t]) => `<div class="alert ${k}">${t}</div>`).join('')}</div>
        ${ui.dview === 'timeline' ? timelineHTML(day, need, cover) : gridHTML(day, need, cover)}`;
}

// Spreadsheet-style schedule: one row per person, one column per half hour 05:00–05:00.
function gridHTML(day, need, cover, forPrint) {
  const sps = cfg().salesPoints, emps = cfg().employees, working = new Set(day.working);
  const onSchedule = new Set(day.shifts.map(s => s.emp));
  const people = emps.filter(e => working.has(e.id) || onSchedule.has(e.id));
  if (!people.length) return `<div class="tl-wrap"><div class="empty">Tick who's in today, then press Generate schedule.</div></div>`;
  const brk = new Map(); (day.breaks || []).forEach(b => { for (let k = b.slot; k < b.slot + b.len; k++) brk.set(b.emp + ':' + k, b); });
  let h = `<div class="gwrap"><table class="sgrid${forPrint ? ' print' : ''}${ui.brush && !forPrint ? ' painting' : ''}"><colgroup><col class="c-name">${'<col class="c-slot">'.repeat(SLOTS)}<col class="c-num"><col class="c-num">${forPrint ? '<col class="c-sig">' : ''}</colgroup>
    <thead><tr><th class="corner"></th>`;
  for (let k = 0; k < SLOTS; k++) h += `<th class="slot${slotTime(k).endsWith(':00') ? ' hr' : ''}"><span>${slotTime(k)} - ${slotTime(k + 1) === '00:00' ? '24:00' : slotTime(k + 1)}</span></th>`;
  h += `<th class="num">HOURS</th><th class="num rest">Rest hours</th>${forPrint ? '<th class="sig">Signature Supervisor</th>' : ''}</tr></thead><tbody>`;
  people.forEach(e => {
    const mine = day.shifts.filter(s => s.emp === e.id);
    const total = workBlocks(day, e.id).reduce((a, b) => a + b.end - b.start, 0) / 2;
    const want = targetSlots(e, day) / 2;
    const sg = (day.signing || []).includes(e.id) ? ((day.signDir || {})[e.id] === 'on' ? ' sign-on' : ' sign-off') : '';
    h += `<tr><th class="name${forPrint ? sg : ''}">${esc(e.name)}${e.headAt && !forPrint ? ' <span class="star">★</span>' : ''}${isBackup(e) ? ` <span class="tag mgr">${e.manager ? 'mgr' : 'sup'}</span>` : ''}${(day.signing || []).includes(e.id) && !forPrint ? ` <span class="tag">${(day.signDir || {})[e.id] === 'on' ? 'sign on' : 'sign off'}</span>` : ''}</th>`;
    for (let k = 0; k < SLOTS; k++) {
      const s = mine.find(x => k >= x.start && k < x.end), b = brk.get(e.id + ':' + k), sp = s && spById(s.sp);
      const bg = b ? BREAK_COLOR : sp ? sp.color : '';
      const tip = b ? `${b.meal} break ${slotTime(k)}` : sp ? `${sp.name} ${slotTime(s.start)}–${slotTime(s.end)}` : `${e.name}, ${slotTime(k)}: add a shift`;
      h += `<td class="${slotTime(k).endsWith(':00') ? 'hr' : ''}"${bg ? ` style="background:${bg}"` : ''}${forPrint ? '' : ` data-act="cell" data-emp="${e.id}" data-k="${k}" title="${esc(tip)}"`}></td>`;
    }
    const ok = total === want && total > 0;
    h += `<td class="num ${total ? (ok ? 'ok' : 'off') : ''}">${total ? total.toFixed(2).replace('.', ',') : ''}</td><td class="num rest">${total ? (24 - total).toFixed(2).replace('.', ',') : ''}</td>${forPrint ? '<td class="sig"></td>' : ''}</tr>`;
  });
  h += `</tbody></table>`;
  // legend, like the bottom row of the paper schedule
  const shown = sps.filter(sp => need[sp.id].some(x => x > 0) || day.shifts.some(s => s.sp === sp.id));
  if (forPrint) h += `<div class="glegend">${shown.map(sp => `<span><i style="background:${sp.color}"></i>${esc(sp.name)}</span>`).join('')}<span><i style="background:${BREAK_COLOR}"></i>Break</span></div>`;
  else h += `<div class="glegend paint">${sps.map(sp => `<button class="brush${ui.brush === sp.id ? ' on' : ''}" data-act="brush" data-v="${sp.id}" title="Paint ${esc(sp.name)}"><i style="background:${sp.color}"></i>${esc(sp.name)}</button>`).join('')}
      <button class="brush${ui.brush === 'erase' ? ' on' : ''}" data-act="brush" data-v="erase" title="Erase"><i class="eraser"></i>Eraser</button>
      <span class="legend-only"><i style="background:${BREAK_COLOR}"></i>Break</span></div>
    <p class="help paint-help">${ui.brush ? `<b>${ui.brush === 'erase' ? 'Eraser' : esc(spById(ui.brush).name)}</b> selected: press and drag along a person's row. Right-click drag erases. Click the colour again or press Esc to stop.` : 'Pick a colour above, then drag along a person\'s row to add work. Right-click and drag to remove. Without a colour, click a cell to edit that shift.'}</p>`;
  if (!forPrint) {
    h += `<details class="gcov"${day.shifts.length ? '' : ' open'}><summary>Staff on / needed per half hour</summary><table class="sgrid cov"><colgroup><col class="c-name">${'<col class="c-slot">'.repeat(SLOTS)}<col class="c-num"><col class="c-num"></colgroup><tbody>`;
    shown.forEach(sp => {
      h += `<tr><th class="name"><i class="dot" style="background:${sp.color}"></i> ${esc(sp.name)}</th>`;
      for (let k = 0; k < SLOTS; k++) {
        const nn = need[sp.id][k], cc = cover[sp.id][k];
        h += `<td class="${cc < nn ? 'short' : nn || cc ? (cc > nn ? 'over' : 'ok') : ''}${slotTime(k).endsWith(':00') ? ' hr' : ''}" title="${esc(sp.name)} ${slotTime(k)}: ${cc} on, ${nn} needed">${nn || cc ? (cc < nn ? cc - nn : cc) : ''}</td>`;
      }
      h += `<td class="num"></td><td class="num"></td></tr>`;
    });
    h += `</tbody></table><p class="help" style="margin:6px 0 0">Numbers = staff on; red = short by that many.</p></details>`;
  }
  return h + `</div>`;
}

// The printout, laid out like the paper schedule: header strip (pax, day, date, port, times), the grid,
// the colour legend, then opening hours, prebooked numbers and notes.
function printHTML(date, day) {
  const sps = cfg().salesPoints, need = computeNeed(date, day, false), cover = computeCover(day, date);
  const dot = t => t ? t.replace(':', '.') : '';
  const pc = portFor(date, day), calls = (pc.calls || []).filter(c => c[1] || c[2]);
  const port = calls.length ? calls.map(c => esc(c[0] || '')).join(' / ') : esc(pc.label || 'At sea');
  const times = calls.map(c => `${dot(c[1]) || '…'}-${dot(c[2]) || '…'}`).join(' / ');
  const d = new Date(date + 'T12:00:00');
  const dateTxt = `${String(d.getDate()).padStart(2, '0')}/${d.toLocaleDateString('en-GB', {month: 'short'})}`;
  const txt = c => { const m = (c || '#fff').match(/^#?([0-9a-f]{6})$/i); if (!m) return '#000'; const n = parseInt(m[1], 16);
    return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 < 140 ? '#fff' : '#000'; };
  const head = `<table class="ph"><tr><th>PAX:</th><th>CHD / YTH</th><th>DAY</th><th>DATE</th><th>PORT</th><th>TIME</th><td rowspan="2" class="ph-warn">All overtime must be approved by Supervisor or Manager</td></tr>
    <tr><td class="big">${day.pax ? day.pax : ''}</td><td>${esc(day.chd || '')}</td><td>${WDL[wdIndex(date)]}</td><td>${dateTxt}</td><td>${port}</td><td>${times}${times ? ' <small>SHIPTIME</small>' : ''}</td></tr></table>`;
  // opening hours (Placeur follows the buffet, so it isn't listed on its own)
  const maxP = Math.max(1, ...sps.filter(sp => !sp.hoursFrom).map(sp => spHours(sp, date, day).periods.length));
  // Noatun's meals under its opening hours (times from Setup → Noatun → booking types), only when open then
  const mealRows = (sp, per) => (sp.bookingTypes || []).filter(t => t.from && t.to && per.some(p => toSlot(t.from) < endSlot(p.close) && endSlot(t.to) > toSlot(p.open)))
    .map(t => `<tr class="meal"><th style="background:${sp.color};color:${txt(sp.color)}">${esc(t.label)}</th><td>${dot(t.from)}</td><td>-</td><td>${dot(t.to)}</td>${'<td></td><td></td><td></td>'.repeat(maxP - 1)}</tr>`).join('');
  const ohRows = sps.filter(sp => !sp.hoursFrom).map(sp => { const per = spHours(sp, date, day).periods;
    return `<tr><th style="background:${sp.color};color:${txt(sp.color)}">${esc(sp.name)}</th>${per.length ? per.map(p => `<td>${dot(p.open)}</td><td>-</td><td>${dot(p.close)}</td>`).join('') : '<td colspan="3" class="closed">Closed</td>'}${'<td></td><td></td><td></td>'.repeat(Math.max(0, maxP - Math.max(1, per.length)))}</tr>${sp.id === 'noatun' ? mealRows(sp, per) : ''}`; }).join('');
  // prebooked numbers
  const bkRows = sps.filter(sp => (sp.bookingTypes || []).length).map(sp => sp.bookingTypes.map((t, i) => {
    const n = +((day.bookings[sp.id] || {})[t.key]) || 0;
    return `<tr><td class="sw" style="background:${sp.color}"></td><td>${esc(t.label)}:</td><td class="n">${n || ''}</td></tr>`; }).join('')).join('');
  // phone numbers, right edge (Setup → Phone numbers on the printout)
  const phones = `<table class="pph">${PHONES().map(x => `<tr><th style="color:${x.color || '#000'}">${esc(x.label)}</th></tr><tr><td style="color:${x.color || '#000'}">${esc(x.number)}</td></tr>`).join('')}</table>`;
  const bottom = `<div class="pb">
    <table class="poh"><tr><th>Profitcenter</th><th colspan="${maxP * 3}">Opening Hours</th></tr>${ohRows}</table>
    <table class="pbk"><tr><th colspan="3">Prebooked</th></tr>${bkRows}</table>
    <div class="pobs"><div class="pobs-h">Obs</div><div class="pobs-b"></div>
      <div class="pnote y">REMEMBER TO SEASECURE EVERYDAY</div><div class="pnote">REMEMBER CLOSING DOWN LISTS &amp; REST HOURS - EVERY DAY !!!!</div></div>${phones}</div>`;
  return head + gridHTML(day, need, cover, true) + bottom;
}

function timelineHTML(day, need, cover) {
  const sps = cfg().salesPoints;
  let r0 = SLOTS, r1 = 0;
  sps.forEach(sp => need[sp.id].forEach((n, i) => { if (n > 0) { r0 = Math.min(r0, i); r1 = Math.max(r1, i + 1); } }));
  day.shifts.forEach(s => { r0 = Math.min(r0, s.start); r1 = Math.max(r1, s.end); });
  if (r1 <= r0) return `<div class="tl-wrap"><div class="empty">Every sales point is closed today.</div></div>`;
  const cols = r1 - r0;
  let h = `<div class="tl-wrap"><div class="tl" style="--cols:170px repeat(${cols},minmax(30px,1fr));min-width:${170 + cols * 30}px">`;
  h += `<div class="tl-row tl-head"><div class="tl-lab"></div>`;
  for (let i = r0; i < r1; i++) { const t = slotTime(i); h += `<div class="tl-time ${t.endsWith(':30') ? 'half' : ''}">${t.endsWith(':00') ? t.slice(0, 2) : ''}</div>`; }
  h += `</div>`;
  const groups = peopleByPlace(day), col = (x, y) => `grid-row:1;grid-column:${x - r0 + 2}/${y - r0 + 2}`;
  sps.forEach(sp => {
    const n = need[sp.id], c = cover[sp.id], people = groups.get(sp.id) || [];
    if (!n.some(x => x > 0) && !people.length && !day.shifts.some(s => s.sp === sp.id)) return;
    const hr = spHours(sp, curDate, day);
    h += `<div class="tl-sp"><span class="dot" style="background:${sp.color}"></span><b>${esc(sp.name)}</b>
      <span class="muted">${hoursLabel(hr)}</span>
      <button class="link" data-act="add-shift" data-sp="${sp.id}">+ shift</button></div>`;
    people.forEach(({empId, e, list, total}) => {
      h += `<div class="tl-row"><div class="tl-lab" style="grid-row:1"><span class="nm">${esc(e ? e.name : '(removed)')}${e && e.headAt ? ` <span class="star" title="Headwaiter, ${esc((spById(e.headAt) || {}).name || '')}">★</span>` : ''}</span><span class="hrs">${total / 2}h</span></div>`;
      list.forEach(s => {
        const p = spById(s.sp), other = s.sp !== sp.id, w = s.end - s.start;
        const brk = (day.breaks || []).filter(b => b.emp === empId && b.slot >= s.start && b.slot < s.end);
        const tip = `${p ? p.name : '?'} ${slotTime(s.start)}–${slotTime(s.end)} (${w / 2}h)${s.fixed ? ', fixed rule' : ''}${brk.map(b => `, ${b.meal.toLowerCase()} break ${slotTime(b.slot)}`).join('')}. Click to edit.`;
        h += `<div class="tl-bar${other ? ' other' : ''}" style="${col(s.start, s.end)};--c:${p ? p.color : '#888'}" data-act="edit-shift" data-id="${s.id}" title="${esc(tip)}" data-ink="${inkOn(p ? p.color : '')}">${other && w >= 4 ? `<b>${esc(spShort(p))}</b> ` : ''}${w >= 4 ? `${slotTime(s.start)}–${slotTime(s.end)}` : slotTime(s.start)}</div>`;
        brk.forEach(b => h += `<div class="tl-brk" style="${col(b.slot, b.slot + b.len)}" title="${esc(b.meal)} break ${slotTime(b.slot)}–${slotTime(b.slot + b.len)}"></div>`);
      });
      h += `</div>`;
    });
    h += `<div class="tl-row tl-cov"><div class="tl-lab muted" style="font-size:11px">staff on / needed</div>`;
    for (let i = r0; i < r1; i++) {
      const nn = n[i], cc = c[i];
      const cls = cc < nn ? 'short' : (nn === 0 && cc === 0 ? '' : (cc > nn ? 'over' : 'ok'));
      h += `<div class="cov ${cls}">${nn || cc ? cc + '/' + nn : ''}</div>`;
    }
    h += `</div>`;
  });
  return h + `</div></div>`;
}

function periodsEditor(h, attrs) {
  return `<div class="periods">${h.periods.map((p, i) => `<div class="per">
      <select data-ch="per" data-i="${i}" data-f="open" ${attrs}>${timeOpts(p.open)}</select>–<select data-ch="per" data-i="${i}" data-f="close" ${attrs}>${endOpts(p.close)}</select>
      <button class="x" data-act="per-del" data-i="${i}" ${attrs} title="Remove this period">✕</button></div>`).join('') || '<span class="muted per">closed</span>'}
    <button class="link" data-act="per-add" ${attrs}>+ period</button></div>`;
}
// Which hours an editor control belongs to: a sales point's standard week, or one day's override.
function hoursTarget(el) {
  const sp = spById(el.dataset.id);
  if (el.dataset.scope === 'day') {
    const day = getDay(curDate), h = spHours(sp, curDate, day);
    return {h, commit: () => { day.hours[sp.id] = h; saveDay(curDate); scheduleRender(); }};
  }
  const d = el.dataset.d, se = el.dataset.season;
  if (se && cfg().seasons[se]) {
    const sh = (cfg().seasons[se].hours ||= {}), h = normHours((sh[sp.id] || {})[d]);
    return {h, commit: () => { (sh[sp.id] ||= {})[d] = h; saveConfig(); scheduleRender(); }};
  }
  const h = normHours(sp.hours[d]);
  return {h, commit: () => { sp.hours[d] = h; saveConfig(); scheduleRender(); }};
}

/* ============ Painting shifts on the grid ============ */
// Set a person's half hours a..b to a sales point (or clear them), then rebuild their shifts.
function setSlots(day, empId, a, b, spId) {
  const old = day.shifts.filter(s => s.emp === empId), arr = new Array(SLOTS).fill(null);
  old.forEach(s => { for (let k = s.start; k < s.end; k++) arr[k] = s.sp; });
  for (let k = Math.max(0, a); k < Math.min(SLOTS, b); k++) arr[k] = spId;
  const out = [], used = new Set();
  for (let k = 0; k < SLOTS;) {
    if (!arr[k]) { k++; continue; }
    let e = k; while (e < SLOTS && arr[e] === arr[k]) e++;
    const src = old.find(s => s.sp === arr[k] && s.start < e && s.end > k && !used.has(s.id)); // keep its rule tags
    if (src) used.add(src.id);
    out.push(src ? {...src, start: k, end: e} : {id: uid(), emp: empId, sp: arr[k], start: k, end: e});
    k = e;
  }
  day.shifts = [...day.shifts.filter(s => s.emp !== empId), ...out];
}
const paint = {active: false, justDone: false};
function paintCells(row, a, b, color) {
  row.querySelectorAll('td[data-emp]').forEach(td => { const k = +td.dataset.k; td.style.background = k >= a && k <= b ? color : (paint.base[k] || ''); });
}
document.addEventListener('pointerdown', e => {
  const td = e.target.closest && e.target.closest('.sgrid td[data-emp]'); if (!td) return;
  const erase = e.button === 2 || ui.brush === 'erase';
  if (!erase && !ui.brush) return; // no colour picked: normal click opens the editor
  if (e.button !== 0 && e.button !== 2) return;
  e.preventDefault();
  const row = td.parentElement;
  paint.active = true; paint.emp = td.dataset.emp; paint.from = paint.to = +td.dataset.k; paint.row = row;
  paint.sp = erase ? null : ui.brush; paint.color = erase ? '#ffffff' : spById(ui.brush).color;
  paint.base = [...row.querySelectorAll('td[data-emp]')].map(x => x.style.background);
  paintCells(row, paint.from, paint.to, paint.color);
});
document.addEventListener('pointermove', e => {
  if (!paint.active) return;
  const el = document.elementFromPoint(e.clientX, e.clientY), td = el && el.closest && el.closest('.sgrid td[data-emp]');
  if (!td || td.dataset.emp !== paint.emp) return;
  paint.to = +td.dataset.k;
  paintCells(paint.row, Math.min(paint.from, paint.to), Math.max(paint.from, paint.to), paint.color);
});
document.addEventListener('pointerup', () => {
  if (!paint.active) return;
  paint.active = false; paint.justDone = true; setTimeout(() => paint.justDone = false, 50);
  const day = getDay(curDate), a = Math.min(paint.from, paint.to), b = Math.max(paint.from, paint.to) + 1;
  setSlots(day, paint.emp, a, b, paint.sp);
  if (paint.sp && !day.working.includes(paint.emp)) day.working.push(paint.emp);
  placeBreaks(curDate, day); saveDay(curDate); render();
});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.sgrid')) e.preventDefault(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.brush) { ui.brush = null; render(); } });

let dlgShift = null;
function openShift(shift, spId, preset) {
  const {salesPoints: sps, employees: emps} = cfg();
  const day = getDay(curDate);
  dlgShift = shift;
  const f = $('#dlgForm');
  const s = shift || {emp: '', sp: spId || (sps[0] && sps[0].id), start: 22, end: 30};
  if (preset) { const e = empById(preset.emp), pos = e && cfg().positions.find(p => e.allowed.includes(p.key) && empMask(e, p.sp)[preset.start]);
    Object.assign(s, {emp: preset.emp, start: preset.start, end: Math.min(SLOTS, preset.start + 8)}, pos ? {sp: pos.sp} : {}); }
  const working = new Set(day.working);
  const sorted = [...emps].sort((a, b) => (working.has(b.id) - working.has(a.id)) || a.name.localeCompare(b.name));
  f.emp.innerHTML = sorted.map(e => `<option value="${e.id}" ${e.id === s.emp ? 'selected' : ''}>${esc(e.name)}${working.has(e.id) ? '' : ' (not ticked in)'}</option>`).join('');
  f.sp.innerHTML = sps.map(x => `<option value="${x.id}" ${x.id === s.sp ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  let so = '', eo = '';
  for (let i = 0; i < SLOTS; i++) so += `<option value="${i}" ${i === s.start ? 'selected' : ''}>${slotTime(i)}</option>`;
  for (let i = 1; i <= SLOTS; i++) eo += `<option value="${i}" ${i === s.end ? 'selected' : ''}>${slotTime(i)}</option>`;
  f.start.innerHTML = so; f.end.innerHTML = eo;
  $('#dlgTitle').textContent = shift ? 'Edit shift' : 'Add shift';
  $('#dlgDel').hidden = !shift;
  $('#dlg').showModal();
}
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, day = getDay(curDate);
  const start = +f.start.value, end = +f.end.value;
  if (end <= start) { alert('The shift must end after it starts.'); return; }

  if (dlgShift) { if (dlgShift.emp !== data.emp) delete dlgShift.sub; Object.assign(dlgShift, data); } else day.shifts.push({id: uid(), ...data});
  $('#dlg').close(); placeBreaks(curDate, day); saveDay(curDate); render();
});
$('#dlgDel').onclick = () => { const day = getDay(curDate); day.shifts = day.shifts.filter(s => s !== dlgShift); $('#dlg').close(); placeBreaks(curDate, day); saveDay(curDate); render(); };

document.addEventListener('click', e => {

      if (!day.signing.includes(id)) { day.signing = [...day.signing, id]; day.signDir[id] = 'off'; }

      else { day.signing = day.signing.filter(x => x !== id); delete day.signDir[id]; }
      break;
    case 'toggle': day.working = day.working.includes(id) ? day.working.filter(x => x !== id) : [...day.working, id]; break;

      sp.paxRules.push({...last, from: last.from + 500}); saveConfig(); render(); return; }

    case 'per-add': {

      if (!confirm('Replace the winter, shoulder and high-season opening hours with the ones from OPENING_HOURS_2026? Your changes to them will be lost.')) return;

    case 'srange-del': C.seasonRanges.splice(+b.dataset.i, 1); saveConfig(); render(); return;
    case 'gen':
      if (!day.working.length) { alert("Tick who's in today first."); return; }
      if (day.shifts.length && !confirm('Replace the current schedule for this day?')) return;
      try { day.shifts = generate(curDate, day); placeBreaks(curDate, day); coverBreaks(curDate, day);
        for (let i = 0; i < 3 && fillWithBackups(curDate, day, day.shifts, computeCover(day)); i++) { placeBreaks(curDate, day); coverBreaks(curDate, day); } mergePieces(day.shifts); }
      catch (err) { console.error(err); alert('Sorry, the schedule could not be generated: ' + err.message + '\n\nPlease download a backup (Sync & backup) and send it to get this fixed.'); return; }

document.addEventListener('change', e => {

  if (ch === 'tfd') { const t = C.fixedRules.find(r => r.type === 'team'); t.fixedDays[+el.dataset.i][f] = el.value; saveConfig(); scheduleRender(); return; }

  if (ch === 'port') { const day = getDay(curDate), pc = portFor(curDate, day); day.port = {arr: pc.arr, dep: pc.dep, [f]: el.value || null}; saveDay(curDate); scheduleRender(); return; }
  if (ch === 'portw') { C.port[el.dataset.d] = {...(C.port[el.dataset.d] || {}), [f]: el.value || null}; saveConfig(); scheduleRender(); return; }
  if (ch === 'dock') { C.dockRule[f] = Math.max(0, parseFloat(el.value) || 0); saveConfig(); scheduleRender(); return; }
  if (ch === 'clean-day') { const sp = spById(id), cc = sp.closedClean; const all = cc.days || [...WD]; cc.days = el.checked ? [...new Set([...all, el.dataset.d])] : all.filter(x => x !== el.dataset.d); saveConfig(); scheduleRender(); return; }
  if (ch === 'clean') { const sp = spById(id); sp.closedClean = {from: '12:00', to: '17:00', on: false, ...(sp.closedClean || {}), [f]: f === 'on' ? el.checked : el.value}; saveConfig(); scheduleRender(); return; }
  if (ch === 'lprep') { const sp = spById(id); sp.lunchPrep[f] = Math.max(0, parseFloat(el.value) || 0); saveConfig(); scheduleRender(); return; }
  if (ch === 'mprep') { const sp = spById(id); sp.morningPrep = {...(sp.morningPrep || {}), [f]: Math.max(0, parseFloat(el.value) || 0)}; saveConfig(); scheduleRender(); return; }
  if (ch === 'per') { const t = hoursTarget(el); t.h.periods[+el.dataset.i][f] = el.value; t.commit(); return; }
  if (ch === 'bt') {
    const t = spById(id).bookingTypes[+el.dataset.i];
    t[f] = f === 'perStaff' ? Math.max(0, parseInt(el.value, 10) || 0) : (f === 'label' ? (el.value.trim() || t.label) : el.value);
  }
  else if (ch === 'phone') { C.rules.phones = PHONES().map(x => ({...x})); C.rules.phones[+el.dataset.i][f] = el.value; }
  else if (ch === 'prio') { C.rules.prio = {...(C.rules.prio || {}), [f]: Math.max(0, parseInt(el.value) || 0)}; }
  else if (ch === 'rule') { C.rules[f] = Math.max(['minRestH', 'signOffBeforeDepMin', 'maxBeforeOpenMin', 'minBreakBlockH'].includes(f) ? 0 : 0.5, parseFloat(el.value) || 0); }
  else if (ch === 'meal') { C.rules.meals[+el.dataset.i][f] = el.value; }
  else if (ch === 'sp') { const sp = spById(id); sp[f] = ['name', 'type', 'color'].includes(f) ? el.value : Math.max(0, parseFloat(el.value) || 0); }
  else if (ch === 'emp' && f === 'headAt' && el.value.startsWith('night:')) { const em = empById(id), t = el.value.slice(6); em.headAt = null; delete em.team; em.night = t;
    const k = t + '-night'; if (C.positions.some(p => p.key === k) && !em.allowed.includes(k)) em.allowed.push(k); }
  else if (ch === 'emp' && f === 'headAt' && el.value.startsWith('team:')) { const em = empById(id), t = el.value.slice(5); em.headAt = null; delete em.night; em.team = t;
    if (!empMask(em, t).some(Boolean)) em.allowed.push(...C.positions.filter(p => p.sp === t).map(p => p.key)); }
  else if (ch === 'emp') { const em = empById(id); if (f === 'headAt') { delete em.team; delete em.night; } em[f] = f === 'headAt' ? (el.value || null) : el.value; if (f === 'headAt' && em.headAt && !empMask({...em, headAt: null}, em.headAt).some(Boolean)) em.allowed.push(...C.positions.filter(p => p.sp === em.headAt).map(p => p.key)); }
  else if (ch === 'emp-rank') { const em = empById(id); em[f] = el.checked; }
  else if (ch === 'emp-allowed') { const em = empById(id), k = el.dataset.p; em.allowed = el.checked ? [...new Set([...em.allowed, k])] : em.allowed.filter(x => x !== k); }
  else if (ch === 'pos') { const ps = C.positions[+el.dataset.i]; ps[f] = f === 'label' ? (el.value.trim() || ps.label) : el.value; }
  else return;
  saveConfig(); scheduleRender();
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ch === 'daytext') { const day = getDay(curDate); day[el.dataset.f] = el.value; saveDay(curDate); return; }
  if (el.dataset.ch === 'pax') {
    const day = getDay(curDate); day.pax = Math.max(0, parseInt(el.value, 10) || 0); saveDay(curDate);
    const hint = $('#pax-hint'); if (hint) hint.innerHTML = 'Minimum staff morning/day/night: ' + paxSummary(day);
    const r = $('#dayResults'); if (r) r.innerHTML = dayResultsHTML(day);
    return;
  }
  if (el.dataset.ch !== 'book') return;
  const day = getDay(curDate), sp = spById(el.dataset.sp), n = Math.max(0, parseInt(el.value, 10) || 0);
  day.bookings[sp.id] = {...(day.bookings[sp.id] || {}), [el.dataset.k]: n};
  saveDay(curDate);
  const bk = day.bookings[sp.id], total = sp.bookingTypes.reduce((a, t) => a + (+bk[t.key] || 0), 0);
  const tEl = document.getElementById('bk-total-' + sp.id); if (tEl) tEl.textContent = total ? total + ' booked' : '';
  const r = $('#dayResults'); if (r) r.innerHTML = dayResultsHTML(day);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.dataset.ch === 'book') {
    e.preventDefault();
    const boxes = [...document.querySelectorAll('[data-ch="book"]')], i = boxes.indexOf(e.target);
    (boxes[i + 1] || e.target).focus(); if (!boxes[i + 1]) e.target.blur();
    return;
  }
  const map = {newEmp: 'emp-add', newSp: 'sp-add', fbPw: 'fb-login'};
  const act = map[e.target.id]; if (act) { e.preventDefault(); document.querySelector(`[data-act="${act}"]`).click(); }
});

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!s.config || !s.days) throw new Error();
    if (!confirm('Replace all current data with this backup?')) return;
    state = s; saveConfig(); Object.keys(state.days).forEach(saveDay); render();
  } catch (err) { alert('That file is not a scheduler backup.'); }
  e.target.value = '';
});

/* ============ Firebase sync (optional) ============ */
const FB = {status: 'local', err: '', auth: null, db: null, user: null, unsubCfg: null, unsubDay: null};
let cfgTimer = null, pendingCfg = false; const dayTimers = {}, pendingDay = {};
function fbCfg() { try { return JSON.parse(localStorage.getItem(LSFB)); } catch (e) { return null; } }
const online = () => FB.status === 'online' && FB.db && FB.user;
function fbError(err) { FB.status = 'error'; FB.err = err && err.message || String(err); renderBadge(); if (view === 'sync') renderSync(); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }

async function fbStart() {
  const c = fbCfg(); if (!c) return;
  FB.status = 'connecting'; renderBadge();
  try {
    const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    if (!window.firebase) await loadScript(base + 'firebase-app-compat.js');
    await loadScript(base + 'firebase-auth-compat.js');
    await loadScript(base + 'firebase-firestore-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(c);
    FB.db = firebase.firestore(); FB.auth = firebase.auth();
    FB.auth.onAuthStateChanged(u => {
      FB.user = u; FB.err = '';
      if (u) { FB.status = 'online'; subscribe(); } else { FB.status = 'signin'; unsubscribe(); }
      render();
    });
  } catch (err) { fbError(err); }
}
function unsubscribe() { if (FB.unsubCfg) FB.unsubCfg(); if (FB.unsubDay) FB.unsubDay(); FB.unsubCfg = FB.unsubDay = null; }
function subscribe() {
  unsubscribe();
  FB.unsubCfg = FB.db.collection('scheduler').doc('config').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || pendingCfg) return;
    if (snap.exists && snap.data().config) { state.config = snap.data().config; if (ensureConfig(state.config)) saveConfig(); else saveLocal(); render(); }
    else saveConfig(); // first device to connect uploads its setup
  }, fbError);
  subscribeDay();
}
function subscribeDay() {
  if (FB.unsubDay) FB.unsubDay(); FB.unsubDay = null;
  if (!online()) return;
  const date = curDate;
  FB.unsubDay = FB.db.collection('scheduler').doc('day-' + date).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || pendingDay[date]) return;
    if (snap.exists && snap.data().day) { state.days[date] = snap.data().day; saveLocal(); if (date === curDate) render(); }
    else if (state.days[date] && (state.days[date].working.length || state.days[date].shifts.length || Object.keys(state.days[date].bookings || {}).length)) saveDay(date);
  }, fbError);
}
function saveConfig() {
  saveLocal(); if (!online()) return;
  pendingCfg = true; clearTimeout(cfgTimer);
  cfgTimer = setTimeout(() => {
    FB.db.collection('scheduler').doc('config').set({config: clone(state.config), updated: Date.now()})
      .catch(fbError).finally(() => pendingCfg = false);
  }, 500);
}
function saveDay(date) {
  saveLocal(); if (!online() || !state.days[date]) return;
  pendingDay[date] = true; clearTimeout(dayTimers[date]);
  dayTimers[date] = setTimeout(() => {
    FB.db.collection('scheduler').doc('day-' + date).set({day: clone(state.days[date]), updated: Date.now()})
      .catch(fbError).finally(() => pendingDay[date] = false);
  }, 400);
}

render();
fbStart();
</script>
